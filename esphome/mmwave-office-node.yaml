# =============================================================================
# NODE 1 — OFFICE
# -----------------------------------------------------------------------------
# This file contains NOTHING but substitutions, this node's own API key, and
# the address the tooling uses to reach it (wifi: use_address, 2026-09-25).
# All behaviour is in mmwave-node-common.yaml, which both nodes share byte for
# byte. (The key moved here 2026-09-22: one key per device is the house
# convention - api_key_mmwave_bench, api_key_ups_monitor, ... - and the shared
# `api_encryption_key` the common file used would have given both nodes one.)
#
# Install geometry (§5.1): sensor at 0.75 m on the desk, seated torso at 1.2 m,
# target at 1.2 m => 19 deg UP-tilt. Feet under the FRONT edge.
# The wall behind sits close (§3.7) — if §5.4 shows an odd g0/g1 floor here,
# that near static return is the first place to look.
# =============================================================================

substitutions:
  node_name: mmwave-office-node
  friendly: Office mmWave
  room_name: Office
  room_slug: office
  # 0.3 = gate heartbeat (installed 2026-09-26, but it shipped still reading
  # 0.2-draft - R13 in CHANGELOG). 0.4 = durable G0 70, 2026-09-28.
  fw_version: "0.4"

  # Idle timeout, §5.5: office 60-120 s. The ROOM-level total lives in HA as
  # input_number.mmw_office_idle_timeout (default 90 s). This is the MODULE's
  # own hold only — short, so the two do not add. See TIMEOUT ARITHMETIC in the
  # common file.
  # 2026-09-28, Bill: the room total runs at 10 s ("works well for me"), so
  # the lamp goes off when THIS 30 s hold ends. The package seed is 120 s,
  # not the 90 s above (mmw_seed_uncommissioned_helpers).
  # Later the same day the seed became 10 s too, Bill: "change the seeds
  # to 30/10".
  radar_timeout_s: "30"

  # Placeholders. §5.2 replaces them with the first gate beyond the far wall,
  # measured. A small office at 1.2 m working distance will likely land at
  # gate 3-4 (2.25-3.0 m); do NOT ship these numbers as if they were measured.
  max_move_gate: "4"
  max_still_gate: "4"
  #
  # BENCH EVIDENCE, 2026-09-07..22 - NOT YET APPLIED, and deliberately so. The
  # bench node in this office ran move 2 / still 4: capping MOVE at gate 2 is
  # what rejected the shared bathroom wall (see the family file's CONTRAST
  # note). That cap was measured at the BENCH position, not the §5.1 mount, and
  # the 19 deg up-tilt changes what each gate sees. Re-measure at the mount in
  # §5.2, then write the result here. Expect move to land at 2, not 4.

  gate_log_period: "5"

  # Daily SPC window: 03:10, an hour the office is reliably empty, so it doubles
  # as the clean noise-floor observation §6.1 asks for.
  eng_window_hour: "3"
  eng_window_minute: "10"

  # --- COMMISSIONED GATE THRESHOLDS -----------------------------------------
  # UNCALIBRATED. These are Hi-Link factory defaults inherited from the common
  # file. After the §5.9 sweep, paste the analysis script's output block here,
  # commit, and reflash. The commit hash is the calibration record (R9).
  # scripts/mmwave_calibrate.py --room office --emit esphome
  #
  # ONE MEASURED EXCEPTION, 2026-09-28 (P25, H:/docs/pending.md): gate 0
  # move 50 -> 70. At 50, single-frame gate-0 ghosts from the loaded office PC
  # (energy 51-57 at 11.8 in) started presence in an empty room, and 11.8 in
  # is inside the 70 in P24 approach limit, so that filter cannot stop them.
  # Set live 09-26 22:12Z and scored over 25.1 h labelled empty: 0 of 28 radar
  # edges opened at gate 0, against 20.1 expected at the G0 = 50 rate
  # [D: 19 / 4.17 h x 4.41 h of PC > 90 W]; Poisson P(0 | 20.1) = 1.9e-9 [D].
  # It lives HERE because push_commissioned_state rewrites every gate at each
  # boot, so a value set only through the number entity reverts to 50. Limits:
  # one PC, one load mix. Still not a section 5.9 calibration - the sweep's
  # output block replaces this line along with the rest.
  g0_move: "70"

esphome:
  name: ${node_name}

api:
  encryption:
    key: !secret api_key_mmwave_office_node

wifi:
  # Where the TOOLING finds this device. The Device Builder add-on runs in a
  # container with no mDNS resolver, so the default <name>.local never resolves
  # there - the bench file's use_address comment has the history. Per device,
  # so it lives here and not in the common file. 10.0.0.57 is the address HA's
  # config entry for this MAC (ac:27:6e:81:e7:f0) connects to [M:
  # core.config_entries, 2026-09-25]. The dashboard reads it from this YAML to
  # reach the device. It IS compiled in, but only as the "Address:" line of the
  # API and OTA config dumps [S: generated api_server.cpp:276 and
  # ota_esphome.cpp:121, ESPHome 2026.9.0] - it changes nothing the device
  # does. Pair with a DHCP reservation, or this goes stale when the lease moves.
  use_address: 10.0.0.57

packages:
  common: !include mmwave-node-common.yaml

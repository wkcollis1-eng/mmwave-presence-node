# =============================================================================
# mmWave BENCH BRING-UP NODE  —  XIAO ESP32-C3 + HLK-LD2410C on jumpers
# Rev 0.1 DRAFT (2026-09-05)
# -----------------------------------------------------------------------------
# SELF-CONTAINED ON PURPOSE. No !include, no packages, no VEML7700, no I2C.
# Flash this one file and the radar comes up. It shares nothing with
# mmwave-node-common.yaml, so nothing you do here can break the production
# config, and the production config cannot break your bench rig.
#
# It is also deliberately NOT the production firmware with bits removed:
#   * engineering mode is ON at boot — the 18 gate energies are the whole point
#     of a bench session, and in production they are off by default (§6.1)
#   * logging is DEBUG, not INFO — you are here to see what the UART is doing
#   * no light sensor, no lighting logic, no lux gate, no HA automations
#   * node name is `mmwave-bench`, so every entity is bench_* and CANNOT
#     collide with the office or family room nodes
#
# DO NOT deploy packages/mmwave_presence.yaml against this node. That package
# expects a light sensor and a room; this node has neither.
#
# =============================================================================
# WIRING  —  READ THIS TWICE BEFORE APPLYING POWER
# =============================================================================
#
# PIN NUMBERING — CORRECTED 2026-09-05 AGAINST THE DATASHEET.
# Datasheet V1.00 §4.2 Table 1 numbers the pins in the SAME order as the
# silkscreen:
#
#     pin 1  UART_Tx     pin 2  UART_Rx     pin 3  OUT
#     pin 4  GND         pin 5  VCC  (5 V)
#
# An earlier draft of this file said the numbering ran OPPOSITE to the
# silkscreen. It does not. That claim came from the design doc's §3.2 table,
# which numbers these pins 1=VCC ... 5=TX — the reverse of the manufacturer's
# numbering. The design document needs correcting; see LD2410C-DOC-REVIEW.md.
# Nothing on the fabricated PCB is affected: the board's pad ORDER is right,
# only the numbering convention in the table is inverted.
#
# The practical rule is unchanged, and is the one that matters:
#
#   >>> IDENTIFY EVERY PIN BY ITS SILKSCREEN LABEL, NEVER BY POSITION. <<<
#
# VCC and TX are at opposite ends of a 5-pin header. Count from the wrong end
# with a 5 V jumper in hand and it lands on TX.
#
# -----------------------------------------------------------------------------
# | LD2410C pad | XIAO pad | GPIO   | direction        | jumper              |
# |-------------|----------|--------|------------------|---------------------|
# | VCC         | 5V       | —      | 5 V IN           | RED, if you have it |
# | GND         | GND      | —      | common ground    | BLACK               |
# | OUT         | D10      | GPIO10 | module -> ESP    | any                 |
# | RX          | D2       | GPIO4  | ESP -> module    | any                 |
# | TX          | D3       | GPIO5  | module -> ESP    | any                 |
# -----------------------------------------------------------------------------
#
# FIVE THINGS THAT WILL COST YOU AN EVENING IF YOU GET THEM WRONG:
#
# 1. VCC IS 5 V, NOT 3V3. Datasheet §7: "Operating Voltage DC 5V, power supply
#    capacity >200mA", average operating current 79 mA. The pin table (§4.2)
#    says "5~12V (advise 5V)". IO level is 3.3 V. On the XIAO that is the pad
#    marked 5V (VBUS), which is only live when USB is plugged in — and USB
#    gives 500 mA, comfortably over the 200 mA the module asks for.
#    CAVEAT, §9 item 1: Amazon reviews describe a "v1.1" that is 3.3 V-only, and
#    there is no authorised distributor for this part. Nobody has confirmed it
#    with a datasheet. Before you power it: look at the silkscreen. If it says
#    anything other than a plain `LD2410C`, stop and ask.
#
# 2. THE UART IS CROSSED, AND THE NET NAMES ARE THE MODULE'S. Module TX goes to
#    the ESP's rx_pin. Module RX comes from the ESP's tx_pin. §3.2 names every
#    net for the MODULE's pin precisely because "TX" alone is ambiguous in a
#    crossover — it caused two errors during the PCB design. If the version text
#    sensor never populates, swap these two first; it costs nothing and it is
#    the most common bring-up fault.
#
# 3. OUT MUST NOT GO TO D9 / GPIO9. OUT is push-pull and sits LOW in an empty
#    room. GPIO9 is a strapping pin, and low at reset enters the serial
#    bootloader. Wired there, the node would fail to boot in an empty room and
#    work perfectly whenever somebody stands in front of it — a bug that hides
#    from the person testing it (§3.3). D0/GPIO2 and D8/GPIO8 are also
#    strapping pins. D10 is correct and safe.
#
# 4. NO R1 AND NO CAPS ON THE BENCH — jumpers only. Neither can damage
#    anything as this file is written. What each one costs:
#
#    R1 (1 kΩ on OUT) — NOT NEEDED HERE. Its only job is fault-current limiting
#    under contention (§3.3), and contention needs GPIO10 driven as an OUTPUT
#    while the module drives OUT. Below, GPIO10 is `mode: input: true`, no pull,
#    no `output:` anywhere. ESP32-C3 GPIO10 is a plain GPIO — high-Z at reset,
#    untouched by the ROM bootloader. Two rules keep that true:
#      * DO NOT add an `output:`, a `switch: platform: gpio`, or a `light:` on
#        GPIO10. That one change is what makes the missing resistor matter.
#      * DO NOT power the module from a separate bench supply. Sharing the
#        XIAO's 5V pad is what makes back-feed impossible. An unpowered ESP with
#        the module driving 3.3 V into GPIO10 forward-biases the ESP's ESD diode
#        into a dead rail, and R1 is exactly what would bound that current.
#
#    C1/C2/C3 (decoupling) — THE ONE THAT ACTUALLY MATTERS, and not for
#    reliability. The module has its own onboard regulation and will very likely
#    just run. But jumper leads add roughly 100-200 nH to the supply of an FMCW
#    radar whose PA switches hard, and DS §7 asks for >200 mA capacity against a
#    79 mA average — that gap IS the transient headroom.
#
#      >>> DO NOT COLLECT §5.3 CALIBRATION DATA ON THE JUMPER RIG. <<<
#
#    Supply droop raises and roughens the gate-energy floor in an empty room,
#    and that floor is E_clutter. A contaminated E_clutter raises every move
#    threshold, and it would be carried into the PCB build looking like a
#    property of the room. Bring-up, range-gate intuition and the §5.0 checklist
#    are all fine here; threshold derivation is not.
#
#    Free mitigations, in order of effect: shortest jumpers in the bundle for
#    VCC and GND; double them up if you have spares (halves L and R); a decent
#    USB cable, not a thin charge-only one (C3 Wi-Fi TX bursts pull 300 mA+ and
#    the cable resistance is in series with everything); pin-to-pin rather than
#    through breadboard rails. Any 10 µF or 0.1 µF from the parts bin, placed
#    VCC-to-GND AT THE MODULE END, beats all of the above.
#
#    MEASURE IT RATHER THAN WONDER. §5.0 step 0.1 meters the 5V pad with the
#    radar unplugged; also meter it with the radar connected and Wi-Fi up, which
#    is the loaded case. Below 4.75 V is your answer.
#    SYMPTOMS, all already on the dashboard: `Reset reason` = BROWNOUT is
#    definitive; `Uptime` resetting, `UART healthy` flickering, or `Path skew`
#    jumping around all point the same way. Suspect the supply BEFORE the
#    module, and long before the thresholds.
#
# 5. COMMON GROUND IS NOT OPTIONAL. UART with no shared return does not fail
#    cleanly; it fails intermittently, which reads as a flaky module.
#
# =============================================================================
# BENCH SEQUENCE — this is design doc §5.0, in the order that matters
# =============================================================================
#   0.0  Inspect the module BEFORE first power-on. Silkscreen reads plain
#        `LD2410C`? 2.54 mm pitch? TX/RX/OUT/GND/VCC order as above? Measure
#        VCC-to-GND resistance out of circuit — a dead short means stop.
#   0.1  Power via USB only, radar UNPLUGGED. Meter the XIAO's 5V pad: 4.75–5.25 V.
#        Only then wire the radar.
#   0.2  Flash this file over USB. Watch the log for the UART lock at 256000.
#   0.3  Read `Radar firmware` — if it populates, the UART is good. Record it
#        (§5.11 version freeze).
#   0.4  Turn `Radar Bluetooth` OFF, then press `Radar restart`, THEN confirm
#        it is still off. The reboot is REQUIRED for the command to take effect
#        (protocol V1.07 §2.2.12), not just a way to test persistence. BT is ON
#        from the factory, and its config password is the default "HiLink".
#   0.5  `Engineering mode` is already on. Confirm 18 gate series appear.
#   0.7  Wave a hand at 0.5 m — `Moving target` toggles.
#   0.8  Confirm `Presence (hardware OUT)` agrees with `Presence (UART)`.
#        Watch `Presence path skew` — that is the two paths cross-checking
#        each other (§6.2), and it is the most useful number this rig produces.
#   0.9  CALIPERS. Measure the radar PCB thickness — 1.0 vs 1.6 mm decides
#        10 mm vs 9 mm standoffs (§3.4), and the standoffs are still unordered
#        (§9 item 2). Do this now, while the board is in your hand.
#
# Steps 0.6, 0.10–0.12 need the light sensor, the lid and the enclosure. Not
# this session.
#
# =============================================================================
# FIRST FLASH IS OVER USB. Plug the XIAO in, then:
#     esphome run mmwave-bench.yaml
# OTA works after that, but do not rely on it for a rig you are re-wiring.
# =============================================================================

substitutions:
  node_name: mmwave-bench
  friendly: Bench mmWave

  # ---- BOARD ---------------------------------------------------------------
  # Defaulted to the XIAO ESP32-C3, because that is what the BOM ordered (two,
  # pre-soldered) and what the carrier PCB is designed around. If the board that
  # turns up tomorrow is a generic C3 devkit instead, change these two lines:
  #     esp32.board            -> esp32-c3-devkitm-1
  #     logger.hardware_uart   -> see the note at `logger:` below
  # The GPIO numbers below are raw GPIOs and do not change with the board; only
  # the silkscreen pad labels (D2/D3/D10) do. Check them against your board.
  board_type: seeed_xiao_esp32c3

  # ---- PINS (raw GPIO — see the wiring table above) ------------------------
  pin_radar_tx: GPIO4     # XIAO D2  -> module RX
  pin_radar_rx: GPIO5     # XIAO D3  <- module TX
  pin_radar_out: GPIO10   # XIAO D10 <- module OUT

  # ---- THE LAMP (added 2026-09-07) ----------------------------------------
  # §7 option 2: "move the decision to the ESP driving a smart relay with HA
  # observing". The DECISION is already on-node (§4.2 interval below); this is
  # only the execution path. HA is still in it and cannot be taken out of it —
  # switch.office_lamp is a TP-Link Kasa device reachable only through HA — so
  # §7's open item is narrowed, not closed. A local relay remains the only
  # option that removes HA entirely, and it turns a low-voltage sensor into a
  # mains device.
  lamp_entity: switch.office_lamp

  # ---- COMMISSIONED STATE (R9) --------------------------------------------
  # Added 2026-09-07. These are the values `script.push_commissioned_state`
  # writes into the module's NVM, mirroring production's mechanism exactly.
  # They default to what the module was ALREADY holding on 2026-09-07 so a
  # push is a no-op until you deliberately change one - which is how you test
  # that the push works: change a value here, reflash, watch it land.
  radar_timeout_s: "5"
  # ---- RANGE GATING (R6 / §5.2 / §5.4) ------------------------------------
  # 8 -> 2, MEASURED 2026-09-07 against three real false triggers.
  #
  # THE FAULT: the lamp came on three times in three minutes while the owner
  # was in the BATHROOM next door (18:43:58, 18:45:04, 18:45:25), then once
  # correctly from the office doorway (18:46:02). Per-gate move energies for
  # those two cases separate completely:
  #
  #   gate            range         BATHROOM      DOORWAY     threshold
  #   g0        0.00-0.75 m           11            77           50
  #   g1        0.75-1.50 m           10            90           50
  #   g2        1.50-2.25 m           21           100           40
  #   g3        2.25-3.00 m           52            38           30
  #   g4        3.00-3.75 m          100            28           20
  #
  # The bathroom is a gates 3-4 target (7.4-10.3 ft) with almost nothing in
  # 0-2. The doorway is a gates 0-1 target (2.2-3.3 ft, sustained 90 s at
  # 60-100 energy). Capping at gate 2 therefore drops the bathroom entirely
  # and keeps the doorway with margin on BOTH axes: bathroom energy in the
  # surviving gates peaks at 21 against a g2 threshold of 40.
  #
  # AN EARLIER VERSION OF THIS BLOCK SAID 4, derived from a reported "doorway
  # at 11.3 ft". That figure was wrong - the doorway measures 2.2-3.3 ft, and
  # 11.3 ft was most likely a `Furthest detection seen` max-hold. Gate 4 is
  # exactly where the bathroom saturates at 100, so 4 would have preserved the
  # single worst gate. Measurement beat the quoted number; §5.2 says set this
  # from the coverage sweep, not from a remembered distance.
  #
  # 2 IS THE FLOOR - protocol V1.07 §2.2.3 gives the settable range as 2-8.
  #
  # IT MUST LIVE HERE, NOT IN HA. Typing 2 into the dashboard works until the
  # next `Push commissioned state`, which writes these substitutions back over
  # it. That is R9 doing its job, and it is why the commissioned value belongs
  # in the file.
  # CORRECTED AGAIN 2026-09-07, after a second office entry was measured.
  # max_still_gate 2 WAS WRONG and would have broken seated presence. The two
  # paths need DIFFERENT caps because the office uses them at different ranges:
  #
  #   office ENTRY   move, gates 0-2, all reaching 100   (walking past the unit)
  #   office SEATED  still, gates 3-5, mean 86/74/63     (the chair, 7.4-12.3 ft)
  #   BATHROOM       move, gates 3-4, 52 and 100         (module still stayed 8-16)
  #
  # The bathroom fired through the MOVE path, so capping MOVE at gate 2 removes
  # it: its move energy inside gates 0-2 is only 11/10/21 against thresholds of
  # 50/50/40. Office entry survives untouched at 100.
  #
  # STILL must reach gate 4 or the chair disappears the moment its occupant
  # stops moving - the exact failure a radar was chosen over a PIR to avoid.
  max_move_gate: "2"
  max_still_gate: "4"

  # ---- PUBLISH RATES — RECORDER COST --------------------------------------
  # MEASURED 2026-09-07, and it is the reason the HA UI went sluggish:
  #     one gate series        2,472 rows/h
  #     18 gate series        44,500 rows/h
  #     moving_distance        4,344 rows/h
  #     detection_distance     4,806 rows/h
  #     whole node          ~1.4 MILLION rows/day
  # For scale, the basement TH node runs ~58,000 rows/day and the repo already
  # carries recorder exclusions for it. This rig was ~25x that.
  #
  # gate_period 1s -> 5s cuts the dominant term by five. Drop it back to 1s for
  # a focused 10-minute seat run where you need the fine structure, then put it
  # back. That is the same knob production exposes as `gate_log_period`, for
  # the same reason.
  #
  # DO NOT go below 1s: ESPHome's own default on these is
  # `throttle_with_priority: 1000ms`, and declaring `filters:` REPLACES that
  # default rather than adding to it.
  # ---- DAILY SPC WINDOW (§6.1) — ported from production 2026-09-07 --------
  # Production opens engineering mode at 03:10 and closes it ten minutes later,
  # so the SPC pipeline gets a daily sample of the 18 gate energies without
  # paying the recorder cost of leaving engineering mode on permanently.
  #
  # Set these a couple of minutes ahead of the clock to test it. `duration` is
  # a BENCH AFFORDANCE that production does not have - production hardcodes 10
  # in the lambda. Two minutes makes the test practical; put it back to 10
  # before drawing any conclusion about production timing.
  eng_window_hour: "23"
  eng_window_minute: "50"
  eng_window_minutes: "10"

  gate_period: "5s"
  dist_period: "1s"
  g0_move: "50"
  g0_still: "0"
  g1_move: "50"
  g1_still: "0"
  g2_move: "40"
  g2_still: "40"
  g3_move: "30"
  # g3_still 40 -> 55 (2026-09-07). Bathroom mean 20.9, office seated mean
  # 85.6. Both peak at 99, so peaks cannot separate them - this sits above
  # the bathroom's TYPICAL level while leaving the chair clear margin.
  g3_still: "55"
  g4_move: "20"
  # g4_still 30 -> 55 (2026-09-07). Bathroom mean 29.9, office seated mean
  # 74.2. Both peak at 99, so peaks cannot separate them - this sits above
  # the bathroom's TYPICAL level while leaving the chair clear margin.
  g4_still: "55"
  g5_move: "15"
  g5_still: "30"
  g6_move: "15"
  g6_still: "20"
  g7_move: "15"
  g7_still: "20"
  g8_move: "15"
  g8_still: "20"

  # ---- UART ----------------------------------------------------------------
  # 256000 is the documented factory default and the only rate worth trying
  # first. 9600 is a CONTINGENCY, not an equal alternative (§5.0 step 0.2): if
  # the version sensor stays empty after you have checked the crossover, try
  # 9600 here before concluding the module is dead.
  radar_baud: "256000"

esphome:
  name: ${node_name}
  friendly_name: ${friendly}
  # MECHANISED VERSION FLOOR — §5.11's freeze, asserted instead of documented.
  # Borrowed from tobsch/ld2410. §5.11 says "pin the ESPHome version explicitly
  # rather than tracking latest" and then relies on somebody remembering. This
  # makes the build FAIL on anything older, which is the difference between a
  # policy and a gate.
  #
  # 2026.4.3 is Bill's installed version and the floor these configs were
  # validated against; they also pass on 2026.8.2. Raise it deliberately after
  # re-running A1, A2 and A6 — never as a side effect of an upgrade.
  min_version: 2026.4.3
  project:
    name: "wkcollis1.mmwave-bench"
    version: "0.1"
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(g_events) = 0;
          id(g_last_event_ms) = 0;
          id(g_out_edge_ms) = 0;
          id(g_uart_edge_ms) = 0;
          id(g_dmin) = 9999;
          id(g_dmax) = 0;
          id(g_selftest) = false;
      # Engineering mode ON for bench work. This is the opposite of the
      # production default and it is deliberate — without it there are no gate
      # energies, and the gate energies are what you came to look at.
      - delay: 3s          # let the UART settle before the first command
      - switch.turn_on: eng_mode
      - logger.log: "BENCH: engineering mode requested"

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

logger:
  # DEBUG, not INFO. You want to see the UART frames and any component
  # complaints. Turn it down to INFO once the rig is behaving, because DEBUG
  # logging of a 10 Hz radar over Wi-Fi is not free.
  level: DEBUG
  # The XIAO ESP32-C3 has NATIVE USB — no bridge chip — so the log comes out of
  # the USB Serial/JTAG peripheral. A generic devkit with a CH340 or CP2102
  # bridge uses UART0 instead: delete this line if your board has a bridge chip
  # and you get no serial output.
  hardware_uart: USB_SERIAL_JTAG
  logs:
    # The ld2410 component is chatty at DEBUG once it is working. Raise this to
    # DEBUG while bringing the UART up, then leave it at INFO so the rest of the
    # log is readable.
    ld2410: INFO

# Required by the `text_sensor: platform: debug` reset-reason sensor below.
# Caught by `esphome config` — the bench file had the sensor without the
# component, which is a hard config failure, not a warning.
debug:
  update_interval: 60s

wifi:
  # Tell the TOOLING where to find this device. Default is
  # <name>.local, which the ESPHome add-on cannot resolve: it runs in a
  # container, and containers generally have no mDNS resolver. That is why
  # the dashboard showed this device offline while HA was talking to it
  # normally on the very same network.
  # Read from this YAML by the dashboard - no reflash needed to take effect.
  # Pair with a DHCP reservation, or this goes stale when the lease moves.
  use_address: 10.0.0.57
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  # 15 min is fine on a bench rig sitting next to the AP. If you end up working
  # somewhere with no Wi-Fi, comment out this whole block and the api: block —
  # the node still runs, and the USB log still shows everything.
  reboot_timeout: 15min
  ap:
    ssid: "${friendly} Fallback"
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_key_mmwave_bench
  # Never reboot because HA went away. On a bench rig you WILL disconnect HA,
  # and a node that reboots itself every 15 minutes while you are measuring is
  # worse than useless.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

uart:
  id: uart_radar
  tx_pin: ${pin_radar_tx}
  rx_pin: ${pin_radar_rx}
  baud_rate: ${radar_baud}
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 512

ld2410:
  id: radar
  uart_id: uart_radar

globals:
  - id: g_out_edge_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: g_uart_edge_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Bench toys that turn out to be genuinely useful: how many presence events
  # since boot, how long since the last one, and the distance envelope you have
  # actually managed to produce. The envelope is the quickest read on whether
  # the module is seeing the room or seeing the bench in front of it.
  - id: g_events
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: g_last_event_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: g_dmin
    type: float
    restore_value: false
    initial_value: '9999'
  - id: g_dmax
    type: float
    restore_value: false
    initial_value: '0'
  # Self-test latch — see the SELF-TEST binary sensor below.
  - id: g_selftest
    type: bool
    restore_value: false
    initial_value: 'false'

  # ---- added 2026-09-07 ----------------------------------------------------
  # Timestamp of the last engineering-mode gate frame. `UART healthy` now gates
  # on THIS instead of the version string. Gate energies exist ONLY in
  # engineering mode, which the ESP COMMANDS at boot, so a frame arriving here
  # proves the command landed (ESP->module) AND the module is streaming back
  # (module->ESP) - the same bidirectional proof the version read gives, but in
  # seconds. Measured 2026-09-07: version took 403 s to populate, holding both
  # `UART healthy` and `Self-test passed` at `unknown` for 6 min 43 s.
  - id: g_last_gate_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # ---- §4.2 control-logic emulation ---------------------------------------
  - id: g_occupied
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_latch
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: g_vacant_since_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Calibration hold — set from HA for the duration of a labelled session so
  # the nightly SPC window cannot switch engineering mode off mid-collection.
  # Same role as production's global of the same name.
  - id: g_cal_hold
    type: bool
    restore_value: false
    initial_value: 'false'
  # R9 push, once per boot, mirroring production.
  - id: g_pushed
    type: bool
    restore_value: false
    initial_value: 'false'

# -----------------------------------------------------------------------------
switch:
  - platform: ld2410
    engineering_mode:
      name: "Engineering mode"
      id: eng_mode
      restore_mode: ALWAYS_OFF      # on_boot turns it on after the UART settles
    bluetooth:
      name: "Radar Bluetooth"
      id: radar_bt
      restore_mode: ALWAYS_OFF
      # BLUETOOTH IS ON BY DEFAULT and the OFF COMMAND NEEDS A REBOOT TO TAKE
      # EFFECT — protocol V1.07 §2.2.12: "the Bluetooth function of the module
      # is on by default... After receiving this command, a reboot is required
      # for the function to take effect."
      # So the power cycle in §5.0 step 0.4 is part of the OPERATION, not just
      # a persistence check. Turn it off, press `Radar restart`, THEN verify.
      # Skip the reboot and the radio is still up while this switch reads off.
      # Default password for the BLE config channel is "HiLink" (§6.3) — which
      # is the whole argument for turning it off in a sealed box (§2).
  - platform: template
    name: "Push on boot (production behaviour)"
    id: push_on_boot
    optimistic: true
    # ALWAYS_OFF -> RESTORE_DEFAULT_OFF, fixed 2026-09-07 by the test that was
    # meant to exercise this switch and instead found it could never work.
    #
    # ALWAYS_OFF switches this OFF during boot, BEFORE the boot-push condition
    # is evaluated. So a "do this at boot" flag reset itself at boot and could
    # never once be true when it mattered - structurally incapable of its only
    # job, and silent about it. Measured:
    #     19:22:15  push_on_boot -> ON   (set by hand)
    #     19:22:21  g4 move      -> 82   (marker set)
    #     19:22:53  node restart
    #     19:23:00  push_on_boot -> OFF  (reset by restore_mode)
    #     19:23:00  g4 move      -> 82   (unchanged: no push ran)
    #
    # RESTORE_DEFAULT_OFF keeps the safe default on a fresh flash and lets the
    # choice survive the reboot it exists to act on.
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    # OFF by default because this rig exists to read what the module's NVM
    # ACTUALLY holds (see the NO initial_value note under `number:`). Turn it ON
    # to exercise production's boot-push path. Production fires that push from
    # the version text sensor - i.e. ~6.7 min into every boot. Here it fires off
    # the rewritten UART-health signal instead, which is the point of the fix.
  - platform: template
    name: "Calibration hold"
    id: cal_hold
    icon: mdi:flask-outline
    optimistic: true
    restore_mode: ALWAYS_OFF
    entity_category: config
    turn_on_action:
      - lambda: "id(g_cal_hold) = true;"
      - switch.turn_on: eng_mode
    turn_off_action:
      - lambda: "id(g_cal_hold) = false;"
      - switch.turn_off: eng_mode
    # Production's mechanism for holding engineering mode open across a
    # labelled §5.9 collection run, so the nightly window cannot close it
    # halfway through and truncate the sample.

  - platform: template
    name: "Keep engineering mode on"
    id: eng_keeper
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    icon: mdi:lock-reset
    # Engineering mode is VOLATILE (PR §2.2.5) and at least three things drop
    # it. Measured on this rig, 2026-09-07:
    #   * a threshold push - 21 config-mode entries and exits   (17:11:39)
    #   * a Radar restart  - the module reboots                 (17:21)
    #   * any module power loss
    # `on_boot` only covers ESP boot, so after either of the first two the
    # bench silently loses the photodiode AND all 18 gate energies, with
    # nothing to report it - the entities simply read `unknown`, which is what
    # "the light went unknown" was.
    #
    # Two earlier attempts failed by trying to enumerate the causes: a 500 ms
    # delay after the push (lost the race, the writes drain asynchronously),
    # then a bounded window armed by the push (correct for pushes, blind to
    # Radar restart). This states the INTENT instead - the bench always wants
    # engineering mode on, which is what the on_boot comment already says -
    # and reconciles toward it from any cause, known or not.
    #
    # TO RUN WITH ENGINEERING MODE OFF, turn THIS off first, then the mode
    # itself. Otherwise the reconciler will put it straight back.
  - platform: template
    name: "Lamp control enabled"
    id: lamp_control_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    icon: mdi:lightbulb-on-outline
    # The kill switch for the wiring above. ON by default because commanding
    # the lamp is now the point, but it is here because a BENCH rig that
    # reboots on every flash should not be able to strobe a real lamp in a
    # room somebody is working in. Turn it off while tuning thresholds; the
    # §4.2 logic and `Lamp should be ON` keep running either way, so the
    # decision stays observable with the execution disconnected.

button:
  - platform: ld2410
    restart:
      name: "Radar restart"
    query_params:
      name: "Radar query params"
      id: radar_query
      # Press this after changing anything. It reads the module's ACTUAL
      # parameters back over UART, which is the only way to know a write landed.
    factory_reset:
      name: "Radar factory reset"
      # Returns the module to Hi-Link defaults. Useful on a bench when you have
      # tuned yourself into a corner. It does NOT touch anything in this file.
  - platform: restart
    name: "Node restart"
  - platform: template
    name: "Scramble thresholds (test)"
    icon: mdi:dice-multiple
    on_press:
      - script.execute: scramble_thresholds
    # THE OTHER HALF OF THE R9 TEST. On 2026-09-07 the push was verified by
    # hand-setting ONE threshold and watching it revert — which proved one
    # write landed and said nothing about the other twenty, because writing 40
    # over an existing 40 produces no state change in HA and is therefore
    # indistinguishable from a write that was silently dropped.
    #
    # This sets all 21 to DISTINCT wrong values, so pressing it and then
    # `Push commissioned state` makes every one of the 21 observable: anything
    # still holding a scrambled value did not get written. The values are
    # distinct from each other as well as from the YAML, so a partial push
    # tells you exactly WHICH writes were lost — expect the tail of the
    # sequence if the module drops any under back-to-back load.
    #
    # EXPECT TWO EXCEPTIONS: g0 and g1 still thresholds are inert in the module
    # (protocol V1.07 Table 7 marks static sensitivity for gates 0-1 "not
    # settable"), so they may not take the scrambled value at all. That is the
    # module behaving as documented, not a dropped write.
  - platform: template
    name: "Push commissioned state"
    icon: mdi:upload-lock
    on_press:
      - script.execute: push_commissioned_state
    # R9 PROOF, and it has never been run. Writes all 21 substitution values
    # into the module NVM, then presses `Radar query params` so HA re-reports
    # what the module ACTUALLY holds. To prove the path end to end: change one
    # threshold by hand in HA, press this, watch it snap back to the YAML value.

text_sensor:
  - platform: ld2410
    version:
      name: "Radar firmware"
      id: radar_version
      # THE SINGLE MOST IMPORTANT ENTITY ON THIS RIG. If it has a value, the
      # UART is locked, the crossover is right and the baud rate is right. If it
      # is empty, nothing else on this page means anything — go back to wiring
      # note 2 before touching any other setting.
    mac_address:
      name: "Radar MAC"
  - platform: debug
    reset_reason:
      name: "Reset reason"

# -----------------------------------------------------------------------------
binary_sensor:
  - platform: ld2410
    has_target:
      name: "Presence (UART)"
      id: presence_uart
      on_press:
        - lambda: |-
            id(g_uart_edge_ms) = millis();
            id(g_events)++;
            id(g_last_event_ms) = millis();
            if (id(g_out_edge_ms) != 0) {
              id(path_skew).publish_state(
                (float)((int32_t)id(g_uart_edge_ms) - (int32_t)id(g_out_edge_ms)));
            }
    has_moving_target:
      name: "Moving target"
      id: moving_target
    has_still_target:
      name: "Still target"
      id: still_target
    # A THIRD PRESENCE PATH, AND IT COSTS NOTHING.
    # The module reports its OWN OUT pin state over the UART (engineering mode
    # only; "unknown" otherwise). That makes this a direct check on the JUMPER:
    # if this says the OUT pin is high while `Presence (hardware OUT)` reads
    # low, the fault is the wire or the GPIO, not the radar. On a bench rig
    # being re-wired repeatedly, that is exactly the question you keep asking.
    out_pin_presence_status:
      name: "OUT pin state via UART"
      id: out_via_uart

  # DEFAULT FILTER, and why it is left alone on the three ld2410 sensors above:
  # ESPHome applies `settle: 1000ms` to every ld2410 binary sensor
  # (components/ld2410/binary_sensor.py). `settle` PUBLISHES THE CHANGE
  # IMMEDIATELY and then suppresses further changes for 1 s — it is not
  # `delayed_on`, and it does NOT cost the leading edge. R2's 1000 ms median
  # budget is therefore untouched by it. Worth stating because a 1000 ms filter
  # sitting on the presence path looks exactly like it would blow that budget,
  # and the obvious "fix" of overriding it would only reintroduce flooding.
  - platform: gpio
    pin:
      number: ${pin_radar_out}
      mode:
        input: true
        # NO pull-up and NO pull-down. OUT is push-pull — it drives both rails
        # itself — and adding a pull would fight it. If this reads stuck, the
        # jumper is off, not the pin config.
    name: "Presence (hardware OUT)"
    id: presence_out
    # No delayed_on. On the bench you want the raw edge; this is the path the
    # skew measurement is timed against.
    filters:
      - delayed_off: 2s
    on_press:
      - lambda: |-
          id(g_out_edge_ms) = millis();
          if (id(g_uart_edge_ms) != 0) {
            id(path_skew).publish_state(
              (float)((int32_t)id(g_uart_edge_ms) - (int32_t)id(g_out_edge_ms)));
          }
    on_release:
      - lambda: |-
          id(g_out_edge_ms) = 0;
          id(g_uart_edge_ms) = 0;

  # THE ONE ENTITY TO LOOK AT WHEN YOU FINISH WIRING.
  # Borrowed from Apollo Automation's MSR-2 factory test, which gates each
  # sensor not on being PRESENT but on producing a PLAUSIBLE VALUE — for the
  # radar, `has_target == true && detection_distance > 10`.
  #
  # That is a materially better criterion than `UART healthy` below. The UART
  # being up proves the crossover and the baud rate; it does NOT prove the radar
  # can see. A module with a damaged antenna, a blocked aperture, or thresholds
  # set to 100 answers `query_params` perfectly and detects nothing. This latches
  # true the first time the rig produces a real detection, and then stays true —
  # so it answers "has this rig EVER worked", which on a bench being re-wired is
  # the question you actually keep asking.
  #
  # Latching is deliberate: it is a commissioning gate, not a presence sensor.
  # Press `Node restart` to re-arm it after changing the wiring.
  - platform: template
    name: "Self-test passed"
    id: selftest
    device_class: connectivity
    icon: mdi:clipboard-check

  - platform: template
    name: "UART healthy"
    id: uart_ok
    device_class: connectivity
    # True once the module has answered at all. This is the entity to look at
    # when nothing works: connectivity false = wiring or baud; connectivity
    # true with no detections = aim, thresholds, or the module's view blocked.

  - platform: template
    name: "Paths disagree"
    id: path_disagree
    device_class: problem
    # UART says one thing, the OUT wire says another, for more than 5 minutes.
    # Both come off the same radar by different routes, so sustained
    # disagreement is a UART or component fault, not a sensing failure (§6.2).

  # ---- §4.2 LAMP DECISION, added 2026-09-07 ----------------------------------
  # The production control rule, run on-node so the bench can exercise it with
  # no lamp, no HA automation and no light sensor beyond the module's own.
  # This entity is what a lamp WOULD follow; nothing is switched.
  - platform: template
    name: "Lamp should be ON"
    id: lamp_on
    icon: mdi:lightbulb
    # ---- THE WIRING, added 2026-09-07 ------------------------------------
    # Until now this entity was an indicator and nothing followed it. It now
    # commands ${lamp_entity} through HA.
    #
    # `homeassistant.action` was `homeassistant.service` until ESPHome 2024.8,
    # which renamed it to match HA's own services-to-actions rename. The old
    # form still validates but the dashboard offers a migration for it.
    #
    # REQUIRES A PER-DEVICE HA PERMISSION, and it is OFF by default. The
    # config entry option is `allow_service_calls` (verified 2026-09-07 in
    # .storage/core.config_entries: false on all four ESPHome devices here).
    #
    # HOW TO GRANT IT IS NOT WHERE YOU EXPECT. There is no Configure entry on
    # the ESPHome integration page for it. Nothing requests the permission
    # until the device actually attempts an action, at which point HA raises a
    # REPAIR (Settings -> System -> Repairs) offering to allow it. So the
    # order is: flash, trigger a lamp transition, then answer the repair.
    #
    # THE FAILURE IS SILENT FROM THE NODE'S SIDE. The action executes here and
    # the log line below still prints; HA refuses it on arrival, and only HA's
    # log says so. If `Lamp should be ON` goes true and `Lamp actual state`
    # does not follow, this permission is the first thing to check.
    #
    # EDGE-TRIGGERED, NOT CONTINUOUS, and deliberately so. The node commands
    # the lamp only at the two §4.2 transitions; it never re-asserts. So if
    # somebody hits the wall switch the node does not fight them — the manual
    # state simply stands until the next transition. That is a weaker form of
    # §4.3 / R4a than the design calls for (which detects the override and
    # clears the latch), and R4a is NOT implemented here. `Lamp actual state`
    # below exists so divergence is at least VISIBLE while that stays open.
    on_press:
      - if:
          condition:
            switch.is_on: lamp_control_enabled
          then:
            - homeassistant.action:
                action: switch.turn_on
                data:
                  entity_id: ${lamp_entity}
            - logger.log: "LAMP -> ON  (commanded ${lamp_entity})"
    on_release:
      - if:
          condition:
            switch.is_on: lamp_control_enabled
          then:
            - homeassistant.action:
                action: switch.turn_off
                data:
                  entity_id: ${lamp_entity}
            - logger.log: "LAMP -> OFF (commanded ${lamp_entity})"

  # What the lamp ACTUALLY did, read back from HA.
  #
  # THIS IS internal: true AND YOU CANNOT PUT IT ON A DASHBOARD. ESPHome sets
  # that automatically on every `homeassistant` import platform, and it is
  # right to: re-exporting HA's own state back to HA is a round trip that
  # creates a second, laggier copy of switch.office_lamp. An earlier version of
  # this comment claimed this entity was the observation channel for the
  # dashboard. It is not, and it never appeared there (verified 2026-09-07).
  #
  # WHAT IT IS FOR: on-node logic and logs. §4.3 / R4a — detecting that the
  # lamp changed without this node commanding it, and clearing the latch — has
  # to read the lamp's real state ON THE NODE, and this is that input. R4a is
  # still NOT implemented; this is the wiring it will need.
  #
  # FOR DASHBOARD VISIBILITY use switch.office_lamp directly, beside
  # `Lamp should be ON`. Comparing intent against HA's own switch entity is
  # simpler and one hop shorter than comparing it against a mirror of itself.
  - platform: homeassistant
    name: "Lamp actual state"
    id: lamp_actual
    entity_id: ${lamp_entity}

# -----------------------------------------------------------------------------
# DAILY SPC WINDOW, §6.1 — ported verbatim from mmwave-node-common.yaml so the
# bench tests PRODUCTION'S code path rather than a re-implementation of it.
#
# !! THIS FIGHTS `Keep engineering mode on` — TURN THE KEEPER OFF TO TEST IT !!
# The keeper re-asserts engineering mode within 5 s of finding it off, which is
# exactly what the window's close does deliberately. With the keeper on, the
# window will appear to close and immediately reopen, and the test reads as a
# failure when both halves are actually working. The two are contradictory ON
# PURPOSE: the bench wants engineering mode permanently on, production wants it
# on for ten minutes a day.
# -----------------------------------------------------------------------------
time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: 0
        minutes: ${eng_window_minute}
        hours: ${eng_window_hour}
        then:
          - switch.turn_on: eng_mode
          - logger.log: "SPC window open: engineering mode ON"

# -----------------------------------------------------------------------------
sensor:
  - platform: ld2410
    moving_distance:
      name: "Moving distance"
      id: moving_distance
      # UNITS - 2026-09-07. The module reports cm. HA was silently converting
      # the device_class:distance sensors to INCHES while the template min/max
      # below stayed in cm, so two different units sat side by side on one
      # dashboard - and `Furthest detection seen` is how §3.6's 5.6 m
      # acceptance target gets read. Everything now publishes FEET from the
      # node, and device_class is cleared so HA cannot convert it again.
      unit_of_measurement: "ft"
      device_class: ""
      accuracy_decimals: 1
      filters:
        - throttle: ${dist_period}
        - multiply: 0.032808399      # cm -> ft
      on_value:
        - lambda: |-
            if (x > 0) {
              if (x < id(g_dmin)) { id(g_dmin) = x; id(dist_min).publish_state(x); }
              if (x > id(g_dmax)) { id(g_dmax) = x; id(dist_max).publish_state(x); }
            }
    still_distance:
      name: "Still distance"
      unit_of_measurement: "ft"
      device_class: ""
      accuracy_decimals: 1
      filters:
        - throttle: ${dist_period}
        - multiply: 0.032808399      # cm -> ft
    moving_energy:
      name: "Moving energy"
      id: move_energy
      filters:
        - throttle: ${dist_period}
    still_energy:
      name: "Still energy"
      id: still_energy
      filters:
        - throttle: ${dist_period}
    detection_distance:
      name: "Detection distance"
      unit_of_measurement: "ft"
      device_class: ""
      accuracy_decimals: 1
      filters:
        - throttle: ${dist_period}
        - multiply: 0.032808399      # cm -> ft
    # NOTE: ESPHome already applies `throttle_with_priority: 1000ms` to every
    # ld2410 sensor by default. Declaring `filters:` REPLACES that default, so
    # the 500 ms above is a deliberate loosening for bench responsiveness, and
    # the gate filters below are a deliberate tightening. Nothing here inherits.

    # ---- the 18 gate energies -----------------------------------------------
    # Gate n covers 0.75 m of range: g0 is 0.00-0.75 m, g8 is 6.00-6.75 m.
    # The range is NOT in the entity name: it would slugify into ids like
    # sensor.bench_mmwave_g0_move_0_00_0_75_m, which are unreadable and one
    # typo away from silently not resolving. The ranges live on the
    # dashboard labels instead, where a human reads them.
    # Throttled to 1 s. This is a bench rig, not a 72-hour collection, so the
    # recorder cost that forces 5 s in production does not apply here — but if
    # you leave this running for days, go and read the RECORDER COST note in
    # mmwave-node-common.yaml first.
    g0:
      move_energy:
        name: "g0 move"
        filters: &gate_rate
          - throttle: ${gate_period}
        # UART LIVENESS WITNESS - see the interval block. Engineering-mode-only,
        # so a frame here proves both directions of the UART in seconds.
        on_value:
          - lambda: "id(g_last_gate_ms) = millis();"
      still_energy:
        name: "g0 still"
        filters: *gate_rate
    g1:
      move_energy:
        name: "g1 move"
        filters: *gate_rate
      still_energy:
        name: "g1 still"
        filters: *gate_rate
    g2:
      move_energy:
        name: "g2 move"
        filters: *gate_rate
      still_energy:
        name: "g2 still"
        filters: *gate_rate
    g3:
      move_energy:
        name: "g3 move"
        filters: *gate_rate
      still_energy:
        name: "g3 still"
        filters: *gate_rate
    g4:
      move_energy:
        name: "g4 move"
        filters: *gate_rate
      still_energy:
        name: "g4 still"
        filters: *gate_rate
    g5:
      move_energy:
        name: "g5 move"
        filters: *gate_rate
      still_energy:
        name: "g5 still"
        filters: *gate_rate
    g6:
      move_energy:
        name: "g6 move"
        filters: *gate_rate
      still_energy:
        name: "g6 still"
        filters: *gate_rate
    g7:
      move_energy:
        name: "g7 move"
        filters: *gate_rate
      still_energy:
        name: "g7 still"
        filters: *gate_rate
    g8:
      move_energy:
        name: "g8 move"
        filters: *gate_rate
      still_energy:
        name: "g8 still"
        filters: *gate_rate

    # ---- THE MODULE'S OWN PHOTODIODE -----------------------------------------
    # "This module comes with a photo diode that can be used to detect the
    # output light sensing value" — protocol V1.07 §2.2.18, p.18. The value
    # rides along in the engineering-mode target data, so it costs nothing extra
    # and it works on the bench with NO I2C and NO VEML7700.
    #
    # It is NOT a replacement for the VEML7700 and the design decision does not
    # change. This is a raw 0-255 photodiode count, not calibrated lux, so a
    # threshold set against it is specific to this one part in this one
    # orientation — it transfers to nothing. Calibrated lux is exactly why the
    # VEML7700 was chosen (§5.6): ~18 lx means the same thing on every node and
    # survives a sensor swap. And the photodiode looks wherever the antenna
    # looks, whereas the VEML7700 sits on a 150 mm cable and is aimed
    # deliberately (§2).
    #
    # What it IS good for: a free sanity channel tomorrow, and a cross-check
    # against the VEML7700 later. If they ever disagree in shape, one of them is
    # dirty or blocked.
    #
    # CONFIRMED PRESENT on the ld2410 platform (not LD2412-only, as an earlier
    # draft of this file guessed): ESPHome documents `light` as "When in
    # engineering mode, indicates the light sensitivity, otherwise `unknown`.
    # Value between 0 and 255."
    #
    # ENGINEERING MODE ONLY — it reads `unknown` with engineering mode off,
    # which is the production default (§6.1). So this is a bench and
    # commissioning instrument, not a telemetry channel.
    light:
      name: "Module photodiode"
      id: module_light

  # ---- bench instrumentation ------------------------------------------------
  - platform: template
    name: "Presence path skew"
    id: path_skew
    unit_of_measurement: "ms"
    accuracy_decimals: 0
    # Signed, published on the SECOND of the two presence edges. Positive means
    # the UART frame arrived after the wire did. Both paths leave the same
    # radar, so this is a direct measurement of what the UART decode costs you —
    # and R2 gives the whole system a 1000 ms median budget, so it is worth
    # knowing early how much of that is spent inside the node.

  - platform: template
    name: "Presence events since boot"
    id: event_count
    accuracy_decimals: 0
    lambda: "return (float)id(g_events);"
    update_interval: 2s

  - platform: template
    name: "Seconds since last event"
    id: event_age
    unit_of_measurement: "s"
    accuracy_decimals: 0
    lambda: |-
      if (id(g_last_event_ms) == 0) return NAN;
      return (millis() - id(g_last_event_ms)) / 1000.0f;
    update_interval: 2s

  - platform: template
    name: "Idle countdown"
    id: idle_countdown
    unit_of_measurement: "s"
    accuracy_decimals: 0
    # Seconds until the lamp is released, once the room reads empty. Exists so
    # the §4.2 timeout is something you can WATCH on the bench rather than infer
    # from a lamp that changes state a minute and a half later.

  - platform: template
    name: "Closest detection seen"
    id: dist_min
    unit_of_measurement: "ft"
    accuracy_decimals: 1
  - platform: template
    name: "Furthest detection seen"
    id: dist_max
    unit_of_measurement: "ft"
    accuracy_decimals: 1
    # The envelope since boot. Walk the room, then read these: the far number is
    # your first real measurement against the 5.6 m acceptance target (§3.6),
    # which the design doc is explicit is a TEST REQUIREMENT and not a
    # calculated link budget. Press Node restart to reset the envelope.

  - platform: wifi_signal
    name: "RSSI"
    update_interval: 30s
  - platform: uptime
    name: "Uptime"
  - platform: internal_temperature
    name: "Node temperature"

# -----------------------------------------------------------------------------
# NUMBERS — the tuning surface. Change one, watch presence change. That is the
# entire point of a bench rig, and it is much cheaper to learn here than in a
# dark family room.
#
# NO `initial_value` ON THE THRESHOLDS, deliberately: on the bench you want to
# see what the MODULE currently holds in its own NVM, not overwrite it on every
# boot. Press `Radar query params` to read the real values back.
# -----------------------------------------------------------------------------
number:
  - platform: ld2410
    timeout:
      name: "Timeout"
      id: n_timeout
      # How long the module holds presence after the target leaves. Short (5-10 s)
      # on the bench so you are not waiting around; production uses 30 s and puts
      # the room-level hold in HA so the two cannot add up (see the TIMEOUT
      # ARITHMETIC note in mmwave-node-common.yaml).
    max_move_distance_gate:
      name: "Max move gate"
      id: n_max_move
    max_still_distance_gate:
      name: "Max still gate"
      id: n_max_still
      # Settable range is 2-8 (protocol V1.07 §2.2.3). The datasheet p.8 says
      # "1 to 8"; the protocol doc is newer and is what the command obeys.
      # Factory default for both is 8, with a 5 s no-one duration.
      # Set these to the first gate BEYOND the far wall once you are in a real
      # room — this is the through-wall mitigation for R6 (§5.2).

    # g0/g1 still_threshold is REQUIRED by ESPHome's schema (cv.Required in
    # every gX block) but INERT in the module — protocol V1.07 Table 7 marks
    # static sensitivity for gates 0 and 1 "-(not settable)", 0-1.5 m being too
    # close for static thresholding. Declared so the config compiles; expect
    # moving these two to do nothing at all.
    g0:
      move_threshold: {name: "g0 move threshold", id: n_g0_move}
      still_threshold: {name: "g0 still threshold", id: n_g0_still}
    g1:
      move_threshold: {name: "g1 move threshold", id: n_g1_move}
      still_threshold: {name: "g1 still threshold", id: n_g1_still}
    g2:
      move_threshold: {name: "g2 move threshold", id: n_g2_move}
      still_threshold: {name: "g2 still threshold", id: n_g2_still}
    g3:
      move_threshold: {name: "g3 move threshold", id: n_g3_move}
      still_threshold: {name: "g3 still threshold", id: n_g3_still}
    g4:
      move_threshold: {name: "g4 move threshold", id: n_g4_move}
      still_threshold: {name: "g4 still threshold", id: n_g4_still}
    g5:
      move_threshold: {name: "g5 move threshold", id: n_g5_move}
      still_threshold: {name: "g5 still threshold", id: n_g5_still}
    g6:
      move_threshold: {name: "g6 move threshold", id: n_g6_move}
      still_threshold: {name: "g6 still threshold", id: n_g6_still}
    g7:
      move_threshold: {name: "g7 move threshold", id: n_g7_move}
      still_threshold: {name: "g7 still threshold", id: n_g7_still}
    g8:
      move_threshold: {name: "g8 move threshold", id: n_g8_move}
      still_threshold: {name: "g8 still threshold", id: n_g8_still}

  # ---- §4.2 CONTROL SURFACE, added 2026-09-07 --------------------------------
  # Production keeps these two in HA as input_numbers (packages/mmwave_presence
  # .yaml) because the control decision lives in HA. On the bench they live on
  # the node so the rig stays self-contained and needs no HA package - the LOGIC
  # under test is identical, only the location differs.
  - platform: template
    name: "Light threshold (raw)"
    id: n_light_threshold
    optimistic: true
    initial_value: 10
    restore_value: true
    min_value: 0
    max_value: 255
    step: 1
    mode: box
    entity_category: config
    # RAW 0-255 PHOTODIODE COUNT, NOT LUX. Protocol V1.07 §2.2.18. This number is
    # specific to THIS module in THIS orientation and transfers to nothing - it
    # proves the control LOGIC, not the threshold VALUE. The production
    # threshold is ~18 CALIBRATED LUX from the VEML7700 (§5.6), and that is the
    # number that survives a sensor swap. Do not carry this value forward.
    # POLARITY MEASURED 2026-09-07: higher = more light. Office ambient reads
    # 18; a hand over the module reads 2. The default was 20, which sat ABOVE
    # ambient - so the room read "dark" at normal office light and the lamp
    # latched on every entry. 10 sits between the two measured states, so
    # covering the module is a genuine dark->occupied test.
  - platform: template
    name: "Idle timeout"
    id: n_idle_timeout
    optimistic: true
    initial_value: 90
    restore_value: true
    min_value: 5
    max_value: 600
    step: 5
    unit_of_measurement: "s"
    mode: box
    entity_category: config
    # §5.5: office 90 s, family room 300 s. This is the ROOM-level hold and it is
    # deliberately separate from the module's own `Timeout` (5 s here) so the two
    # cannot be silently added together - the TIMEOUT ARITHMETIC point in
    # mmwave-node-common.yaml.
    #
    # restore_value ADDED 2026-09-07 to both control numbers. Without it every
    # flash reset them to the YAML defaults — measured 17:10:40, a flash put the
    # light threshold back from 75 to 10 and this from 15 to 90, silently
    # discarding a bench session's tuning. `initial_value` is now the FIRST-BOOT
    # default and the record of intent; runtime tuning survives a reflash.
    #
    # This does NOT weaken R9. R9 is about the RADAR's NVM holding values that
    # exist nowhere in git — which is why the 21 gate thresholds deliberately
    # keep no restore and are pushed from YAML. These two are bench display
    # controls that drive no commissioned state. When a value here is settled,
    # write it into initial_value; that is the commissioning step.

select:
  - platform: ld2410
    distance_resolution:
      name: "Gate resolution"
      # 0.75 m per gate (default) or 0.2 m. Worth trying 0.2 m on the bench to
      # see what it costs in total range — but the production nodes use 0.75 m,
      # and changing it invalidates every threshold derived at the other setting.

    # ---- `baud_rate` IS DELIBERATELY NOT EXPOSED --------------------------
    # The ld2410 select platform offers one. It is omitted here, and this
    # comment exists so the omission stays a decision rather than an accident
    # somebody "fixes".
    #
    # THE MODULE HAS FIVE PINS AND NO RESET (DS §4.2). There is no hardware
    # recovery. If it becomes unreachable over UART **and** Bluetooth is off,
    # it is unrecoverable — and changing the baud rate is essentially the ONLY
    # way to make a live module unreachable. Every other "UART failure" is a
    # wire (fix the wire), an ESP (fix the ESP), or a dead radar (BT would not
    # have saved it either).
    #
    # One accidental tap on a dropdown should not be able to brick a part with
    # no reset pin. Removing the control removes the failure.
    #
    # RECOVERY IF IT EVER DOES HAPPEN, no Bluetooth required: `radar_baud` is a
    # substitution at the top of this file. The documented rates are
    #   9600  19200  38400  57600  115200  230400  256000(default)  460800
    # Change the substitution, reflash, watch `Radar firmware`. Eight attempts,
    # about ten minutes, and it needs nothing you do not already have.

# -----------------------------------------------------------------------------
interval:
  # ---------------------------------------------------------------------------
  # UART HEALTH - REWRITTEN 2026-09-07. Two defects.
  #
  # 1. IT PUBLISHED ONLY ON CHANGE:  if (ok != id(uart_ok).state) { ... }
  #    A template binary sensor that has never published reads `false`
  #    internally while HA shows `unknown`. While the UART was coming up `ok`
  #    was false, so the test was `false != false` and it never published. The
  #    entity sat at `unknown` indefinitely - indistinguishable from a dead
  #    instrument. Same bug fixed in `Paths disagree` below. THE SAME BUG IS IN
  #    PRODUCTION, on `lux_stale` and on its own `path_disagree`.
  #
  # 2. IT GATED ON THE VERSION STRING - the slowest datum on the bus. Measured
  #    2026-09-07: 403 s to populate, holding `UART healthy` AND `Self-test
  #    passed` at `unknown` for 6 min 43 s after every boot, while gate
  #    energies, distances and NVM thresholds all streamed correctly. The
  #    version, the MAC and `gate_resolution` all arrive from the same deferred
  #    config read, so any of them is a bad gate. Engineering-mode gate frames
  #    prove the same thing in seconds - they exist ONLY in engineering mode,
  #    which the ESP itself commanded at boot, so a frame arriving proves BOTH
  #    directions of the UART.
  # ---------------------------------------------------------------------------
  - interval: 5s
    then:
      - lambda: |-
          static bool uart_published = false;
          bool fresh = id(g_last_gate_ms) != 0
                       && (millis() - id(g_last_gate_ms)) < 5000;
          bool have_version = id(radar_version).has_state()
                              && !id(radar_version).state.empty()
                              && id(radar_version).state != "unknown";
          bool ok = fresh || have_version;
          if (!uart_published || ok != id(uart_ok).state) {
            id(uart_ok).publish_state(ok);
            uart_published = true;
            if (!ok) ESP_LOGW("bench", "no radar frames - check crossover and baud");
          }
          // Self-test: UART up AND a real detection at a plausible distance.
          // Latches; cleared only by a node restart.
          // THRESHOLD IS NOW IN FEET. 0.33 ft = 10 cm. The old literal was
          // 10.0f in centimetres; left unchanged through the unit conversion it
          // would have silently demanded a target at TEN FEET before passing.
          if (!id(g_selftest) && ok && id(presence_uart).state
              && id(moving_distance).has_state() && id(moving_distance).state > 0.33f) {
            id(g_selftest) = true;
            id(selftest).publish_state(true);
            ESP_LOGI("bench", "SELF-TEST PASSED - UART locked, radar detecting at %.1f ft",
                     id(moving_distance).state);
          }
          // R9 push, once per boot, only when the switch is on.
          if (ok && !id(g_pushed) && id(push_on_boot).state) {
            id(g_pushed) = true;
            ESP_LOGI("bench", "R9: UART proven - pushing commissioned state");
            id(push_commissioned_state).execute();
          }

  # ---------------------------------------------------------------------------
  # ENGINEERING-MODE KEEPER. See the `Keep engineering mode on` switch for the
  # full history of why this is a reconciler and not an event handler.
  #
  # 5 s, not 1 s: turning engineering mode on is a config-mode command, and if
  # the module is unreachable this would otherwise retry twelve times a minute
  # for as long as the fault lasts.
  # ---------------------------------------------------------------------------
  - interval: 5s
    then:
      - lambda: |-
          if (id(eng_keeper).state && !id(eng_mode).state) {
            id(eng_mode).turn_on();
            ESP_LOGI("bench", "engineering mode re-asserted by keeper");
          }

  # ---------------------------------------------------------------------------
  # CLOSE THE DAILY SPC WINDOW, §6.1 — production's code, unchanged except that
  # the 10-minute duration is a substitution here so it can be tested in two.
  #
  # Done as an interval rather than a second on_time because the close time is
  # start + duration, and computing that in a cron expression across an hour
  # boundary is a bug waiting to happen. This checks a wall-clock condition
  # instead, which is correct at midnight, across DST, and after a reboot that
  # lands mid-window.
  #
  # THE ARITHMETIC IS THE POINT OF THE TEST: `(now - start + 1440) % 1440`
  # wraps correctly over midnight. It runs once a day at 03:10 in production,
  # so a fault here surfaces as weeks of missing SPC data rather than an error.
  # ---------------------------------------------------------------------------
  - interval: 30s
    then:
      - if:
          condition:
            and:
              - switch.is_on: eng_mode
              - lambda: "return !id(g_cal_hold);"
              - lambda: |-
                  auto t = id(ha_time).now();
                  if (!t.is_valid()) return false;
                  int now_min   = t.hour * 60 + t.minute;
                  int start_min = ${eng_window_hour} * 60 + ${eng_window_minute};
                  int elapsed   = (now_min - start_min + 1440) % 1440;
                  return elapsed >= ${eng_window_minutes} && elapsed < 60;
          then:
            - switch.turn_off: eng_mode
            - logger.log: "SPC window closed: engineering mode OFF"

  # Two-path cross-check (§6.2). 300 s, because brief disagreement is EXPECTED:
  # delayed_off is 2 s on one path and the module timeout is seconds to tens of
  # seconds on the other. Measured 2026-09-07: falling edges differ by 2.0-2.7 s
  # every cycle, rising edges by 0-1 ms.
  - interval: 1s
    then:
      - lambda: |-
          static uint32_t disagree_s = 0;
          static bool armed = false;
          // Both inputs must be real before this instrument means anything.
          // Until then `unknown` is honest rather than merely unpublished.
          if (!id(presence_uart).has_state() || !id(presence_out).has_state()) return;
          // First tick with both inputs live: publish the healthy state so the
          // entity can leave `unknown`. Without this it could ONLY leave
          // `unknown` by reporting a FAULT - a health indicator invisible until
          // it fails, which is exactly what it did for this rig's whole life.
          if (!armed) { id(path_disagree).publish_state(false); armed = true; }
          bool a = id(presence_uart).state;
          bool b = id(presence_out).state;
          if (a != b) { disagree_s++; }
          else {
            if (id(path_disagree).state) id(path_disagree).publish_state(false);
            disagree_s = 0;
          }
          if (disagree_s > 300 && !id(path_disagree).state) {
            id(path_disagree).publish_state(true);
            ESP_LOGW("bench", "presence paths disagree %u s (uart=%d out=%d)",
                     disagree_s, a, b);
          }

  # ---------------------------------------------------------------------------
  # §4.2 CONTROL LOGIC, emulated on-node. Added 2026-09-07.
  #
  #   EMPTY    -> on presence: sample light ONCE, latch the decision
  #   OCCUPIED -> light is NOT re-evaluated
  #   vacant for IDLE_TIMEOUT -> release the latch, lamp off
  #
  # The latch is the whole design. A node that re-read ambient light while the
  # lamp it controls is on would see its own lamp push the reading over
  # threshold, switch off, go dark, and switch back on. Forever.
  # ---------------------------------------------------------------------------
  - interval: 1s
    then:
      - lambda: |-
          static bool lamp_published = false;
          if (!lamp_published) { id(lamp_on).publish_state(false); lamp_published = true; }
          if (!id(presence_uart).has_state()) return;

          bool presence = id(presence_uart).state;
          uint32_t now = millis();

          if (presence) {
            id(g_vacant_since_ms) = 0;
            // COUNTDOWN WHILE OCCUPIED — changed 2026-09-07 after bench use.
            // This published NAN here, so the entity read `unknown` for the
            // WHOLE of every occupancy: 16 s on one cycle, 3 min 40 s on the
            // next. `unknown` for an unbounded stretch is indistinguishable
            // from a dead sensor, which is the same complaint that got
            // `UART healthy` and `Paths disagree` fixed earlier today.
            // It now shows the ARMED value - what the countdown will start
            // from the moment the room empties - and re-publishes if the
            // timeout number is changed mid-occupancy.
            {
              float armed = id(n_idle_timeout).state;
              if (!id(idle_countdown).has_state()
                  || id(idle_countdown).state != armed)
                id(idle_countdown).publish_state(armed);
            }
            if (!id(g_occupied)) {
              // §7 GUARD + TRANSITION INTEGRITY. Fixed 2026-09-07 after the
              // first bench run of this logic, in which the lamp was never
              // commanded during a six-minute occupancy.
              //
              // The light is sampled ONCE at this edge and never re-evaluated
              // while occupied - that is the §4.2 latch, and it is correct.
              // But it means CONSUMING this edge without a reading throws away
              // the only chance this occupancy had to decide, and the decision
              // cannot be revisited until the room has been empty for a FULL
              // idle timeout.
              //
              // OBSERVED 2026-09-07: node booted 14:37:14 and presence went
              // true within seconds - but the photodiode is ENGINEERING-MODE
              // ONLY and engineering mode is commanded at boot+3s. The edge was
              // consumed with no reading, the lamp stayed off through the whole
              // occupancy, and it only latched at 14:49:25 - after a full 90 s
              // vacancy had reset the state machine at 14:44:33.
              //
              // PRODUCTION HAS THE SAME RACE. The VEML7700 polls every 10 s, so
              // a node rebooting into an occupied room can reach this edge
              // before its first lux sample - and there the idle timeout is
              // 90 s (office) or 300 s (family room).
              //
              // FIX: do not set g_occupied yet. Stay EMPTY and retry next tick,
              // so the decision is DEFERRED rather than DISCARDED.
              if (!id(module_light).has_state()) {
                static uint32_t warned_ms = 0;
                if (millis() - warned_ms > 30000) {
                  warned_ms = millis();
                  ESP_LOGW("bench", "presence but no light reading yet -"
                                    " holding EMPTY, decision deferred");
                }
                return;
              }
              id(g_occupied) = true;
              bool dark = id(module_light).state < id(n_light_threshold).state;
              if (dark) { id(g_latch) = true; id(lamp_on).publish_state(true); }
              ESP_LOGI("bench", "OCCUPIED: light=%.0f thr=%.0f -> %s",
                       id(module_light).state, id(n_light_threshold).state,
                       dark ? "LAMP ON (latched)" : "already lit, lamp stays off");
            }
          } else if (id(g_occupied)) {
            if (id(g_vacant_since_ms) == 0) id(g_vacant_since_ms) = now;
            uint32_t idle_ms = (uint32_t)(id(n_idle_timeout).state * 1000.0f);
            uint32_t elapsed = now - id(g_vacant_since_ms);
            id(idle_countdown).publish_state(
                elapsed >= idle_ms ? 0.0f : (idle_ms - elapsed) / 1000.0f);
            if (elapsed >= idle_ms) {
              id(g_occupied) = false;
              id(g_vacant_since_ms) = 0;
              if (id(g_latch)) {
                id(g_latch) = false;
                id(lamp_on).publish_state(false);
                ESP_LOGI("bench", "EMPTY %.0f s - LAMP OFF, latch released",
                         id(n_idle_timeout).state);
              }
            }
          }

# -----------------------------------------------------------------------------
# R9: THE COMMISSIONED-STATE PUSH. Mirrors production's
# `script.push_commissioned_state` exactly, including firing `Radar query
# params` at the end so HA re-reports what the module ACTUALLY holds rather
# than what we believe we wrote. The read-back is the proof; the write is not.
#
# WHY THIS EXISTS AT ALL: the ld2410 `number` entities REFLECT the module's NVM
# and WRITE on change - they do NOT push at boot. So thresholds sitting in YAML
# are not in the radar until something pushes them, and "the commissioned state
# is reproducible from version control" would be true of the file and false of
# the hardware. Production fires this from the version text sensor's on_value,
# which we measured at 403 s - so production runs on whatever its NVM already
# held for the first ~6.7 minutes of every boot.
#
# UNPROVEN AND UNDER TEST: 21 `number.set` calls back to back with no delay,
# each entering config mode, writing, and exiting. Whether all 21 land is
# exactly what this rig is now for. Watch the read-back, not the log line.
# -----------------------------------------------------------------------------
script:
  - id: push_commissioned_state
    mode: single
    then:
      - number.set:
          id: n_timeout
          value: ${radar_timeout_s}
      - number.set:
          id: n_max_move
          value: ${max_move_gate}
      - number.set:
          id: n_max_still
          value: ${max_still_gate}
      - number.set:
          id: n_g0_move
          value: ${g0_move}
      - number.set:
          id: n_g0_still
          value: ${g0_still}
      - number.set:
          id: n_g1_move
          value: ${g1_move}
      - number.set:
          id: n_g1_still
          value: ${g1_still}
      - number.set:
          id: n_g2_move
          value: ${g2_move}
      - number.set:
          id: n_g2_still
          value: ${g2_still}
      - number.set:
          id: n_g3_move
          value: ${g3_move}
      - number.set:
          id: n_g3_still
          value: ${g3_still}
      - number.set:
          id: n_g4_move
          value: ${g4_move}
      - number.set:
          id: n_g4_still
          value: ${g4_still}
      - number.set:
          id: n_g5_move
          value: ${g5_move}
      - number.set:
          id: n_g5_still
          value: ${g5_still}
      - number.set:
          id: n_g6_move
          value: ${g6_move}
      - number.set:
          id: n_g6_still
          value: ${g6_still}
      - number.set:
          id: n_g7_move
          value: ${g7_move}
      - number.set:
          id: n_g7_still
          value: ${g7_still}
      - number.set:
          id: n_g8_move
          value: ${g8_move}
      - number.set:
          id: n_g8_still
          value: ${g8_still}
      - logger.log: "R9: commissioned thresholds pushed from YAML into module NVM"
      - button.press: radar_query
      # ---- RESTORE ENGINEERING MODE ---------------------------------------
      # MEASURED 2026-09-07: without this the push leaves engineering mode OFF.
      # The photodiode went `unknown` for 5 min 21 s and every gate energy
      # stopped, starting the exact second the push landed. 21 number.set calls
      # each enter and exit config mode, and engineering mode is volatile
      # (PR §2.2.5). Nothing reported it — the entities simply went quiet.
      #
      # PRODUCTION FIRES THIS PUSH AT BOOT, so production would kill its own
      # gate telemetry on every startup and §6.1's SPC window would sample
      # nothing. mmwave-node-common.yaml needs the same restore.
      # Engineering mode is restored by the keeper reconciler, not from here -
      # the writes above are still draining out of the UART when this line runs,
      # so nothing arm-and-wait can be timed correctly at this point.

  # ---------------------------------------------------------------------------
  # SCRAMBLE — deliberately wrong, deliberately DISTINCT values.
  # Distinct so a partial push is diagnosable: whichever entities still hold a
  # scrambled number after a push are the writes that did not land. All values
  # sit inside the module's legal ranges (thresholds 0-100, gates 2-8), so a
  # value that fails to take is the module refusing it, not a range rejection.
  # ---------------------------------------------------------------------------
  - id: scramble_thresholds
    mode: single
    then:
      - number.set: {id: n_timeout,   value: 9}
      - number.set: {id: n_max_move,  value: 7}
      - number.set: {id: n_max_still, value: 6}
      - number.set: {id: n_g0_move,   value: 61}
      - number.set: {id: n_g0_still,  value: 62}
      - number.set: {id: n_g1_move,   value: 63}
      - number.set: {id: n_g1_still,  value: 64}
      - number.set: {id: n_g2_move,   value: 65}
      - number.set: {id: n_g2_still,  value: 66}
      - number.set: {id: n_g3_move,   value: 67}
      - number.set: {id: n_g3_still,  value: 68}
      - number.set: {id: n_g4_move,   value: 69}
      - number.set: {id: n_g4_still,  value: 70}
      - number.set: {id: n_g5_move,   value: 71}
      - number.set: {id: n_g5_still,  value: 72}
      - number.set: {id: n_g6_move,   value: 73}
      - number.set: {id: n_g6_still,  value: 74}
      - number.set: {id: n_g7_move,   value: 75}
      - number.set: {id: n_g7_still,  value: 76}
      - number.set: {id: n_g8_move,   value: 77}
      - number.set: {id: n_g8_still,  value: 78}
      - logger.log: "TEST: thresholds scrambled - now press Push commissioned state"
      - button.press: radar_query

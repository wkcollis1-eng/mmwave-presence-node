# -----------------------------------------------------------------------------
# SCRIPTS
# -----------------------------------------------------------------------------
script:
  # ---- commanded lamp changes go through here, always ----------------------
  # Every automatic change to a lamp stamps the time first, then acts. R4a's
  # detector reads that stamp. A change made anywhere else in this package
  # WITHOUT going through these scripts will be misread as a human at the
  # switch, and the automation will then correctly refuse to touch the lamp
  # until the room empties. That failure is silent and confusing, so: one door.
  mmw_office_lamp_set:
    alias: "mmW Office: set lamp (stamped)"
    mode: queued
    max: 5
    fields:
      lamp_state:
        description: "on or off"
        example: "on"
    sequence:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.mmw_office_last_cmd
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - service: "homeassistant.turn_{{ lamp_state }}"
        target:
          entity_id: switch.office_lamp

  mmw_family_lamp_set:
    alias: "mmW Family: set lamp (stamped)"
    mode: queued
    max: 5
    fields:
      lamp_state:
        description: "on or off"
        example: "on"
    sequence:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.mmw_family_last_cmd
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - service: "homeassistant.turn_{{ lamp_state }}"
        target:
          entity_id: [switch.family_room, switch.family_room_2, switch.family_room_3]

  # ---- the overnight alarm -------------------------------------------------
  mmw_family_alarm:
    alias: "mmW Family: overnight alarm"
    mode: single          # never two alarm sequences on one lamp
    sequence:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.mmw_family_alarm_running
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.mmw_family_alarm_last_fired
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

      # STAGE 1 — two blinks, then a grace period.
      # This is the part that makes the alarm survivable for the household.
      # A radar cannot tell a resident from an intruder, and the family room is
      # on the way to the kitchen. Two blinks says "I saw you" to a person
      # getting a glass of water and gives them ~20 s to hit disarm before the
      # house starts strobing. An intruder gets the same two blinks and, not
      # having the dashboard, the full sequence.
      #
      # TIMING IS SET BY THE RELAY, NOT BY TASTE. These are Kasa HS103 plugs:
      # a mechanical relay behind a Wi-Fi command with a round trip of order
      # 100-500 ms, and the tplink integration serialises per device. A 0.4 s
      # half-period is not achievable — the commands queue, the flashing comes
      # out irregular, and every cycle is two relay operations on a part with a
      # finite contact life. 1 s reads as unmistakably deliberate and is
      # actually deliverable.
      #
      # If you later want real strobing, that needs a dimmable or colour bulb
      # driven by transitions, not a plug switching mains.
      - repeat:
          count: 2
          sequence:
            - service: homeassistant.turn_on
              target:
                entity_id: [switch.family_room, switch.family_room_2, switch.family_room_3]
            - delay: "00:00:01"
            - service: homeassistant.turn_off
              target:
                entity_id: [switch.family_room, switch.family_room_2, switch.family_room_3]
            - delay: "00:00:01"

      - wait_template: "{{ is_state('input_boolean.mmw_family_alarm_disarm_tonight','on') }}"
        # CHANGED 2026-09-22: `int(20)` -> `int(0)`, and `int(6)` -> `int(0)`
        # on the flash count below. Those fallbacks were second copies of the
        # starting values (R10). The automation refuses to start this script
        # on an uncommissioned 0, and the script does not invent a value.
        timeout: >
          {% set g = states('input_number.mmw_family_alarm_grace') | int(0) %}
          {{ '00:%02d:%02d' % (g // 60, g % 60) }}
        continue_on_timeout: true

      - condition: state
        entity_id: input_boolean.mmw_family_alarm_disarm_tonight
        state: "off"

      # STAGE 2 — the actual alarm.
      - service: persistent_notification.create
        data:
          title: "Family room: motion during quiet hours"
          notification_id: mmw_family_alarm
          message: >
            {{ now().strftime('%Y-%m-%d %H:%M:%S') }} — presence detected in the
            family room during quiet hours. Moving target:
            {{ states('binary_sensor.family_mmwave_moving_target') }}.
            Distance: {{ states('sensor.family_mmwave_moving_distance') }}
            {{ state_attr('sensor.family_mmwave_moving_distance','unit_of_measurement') }}.
            {# CHANGED 2026-09-22: was a literal "cm". HA converts length to the
               display unit system, so on this imperial install the number is
               not in cm; the unit is read from the entity instead of assumed. #}
            Lux: {{ states('sensor.family_mmwave_ambient_light') }}.

            Thermostat witness - main floor motion:
            {{ states('binary_sensor.main_floor_motion') }}, occupancy:
            {{ states('binary_sensor.main_floor_occupancy') }}.
            (Forensics only. The alarm deliberately does NOT wait for this: it
            is PIR, it is elsewhere on the floor, and requiring it would add its
            blind spots and its latency to a security function. But if two
            independent sensors agreed at 02:00, that is worth knowing.)
      - repeat:
          count: "{{ states('input_number.mmw_family_alarm_flashes') | int(0) }}"
          sequence:
            - service: homeassistant.turn_on
              target:
                entity_id: [switch.family_room, switch.family_room_2, switch.family_room_3]
            - delay: "00:00:01.5"
            - service: homeassistant.turn_off
              target:
                entity_id: [switch.family_room, switch.family_room_2, switch.family_room_3]
            - delay: "00:00:01.5"

    # Whatever happens — disarm, timeout, error — the lamp ends OFF and the
    # guard flag is cleared. R7: degrade to a KNOWN state. A failure mid-repeat
    # that left the flag set would suppress override detection indefinitely.
    max_exceeded: silent

  mmw_family_alarm_cleanup:
    alias: "mmW Family: alarm cleanup"
    mode: single
    sequence:
      - service: homeassistant.turn_off
        target:
          entity_id: [switch.family_room, switch.family_room_2, switch.family_room_3]
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.mmw_family_alarm_running
      # The alarm flashing is not a "commanded" change in the R4a sense, but it
      # did move the lamp. Stamp it so the detector does not fire on the last
      # transition of the sequence.
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.mmw_family_last_cmd
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"


# -----------------------------------------------------------------------------
# AUTOMATIONS
# -----------------------------------------------------------------------------
automation:
  # ===========================================================================
  # OFFICE — presence lighting
  # ===========================================================================
  - id: mmw_office_presence_on
    alias: "mmW Office: presence -> lamp on"
    mode: single
    # ADDED 2026-09-22: a second edge during the lux wait below is dropped
    # quietly - it carries no new information, and `single` would log it.
    max_exceeded: silent
    trigger:
      - platform: state
        entity_id: binary_sensor.office_mmwave_presence
        # CHANGED 2026-09-22: was `from: "off"`. On the bench, 24 of 36 returns
        # from `unavailable` came back straight to `on` [M, 2026-09-08..22] -
        # presence already reported when the node or HA reconnected. `from:
        # "off"` fires for none of those, so a person already in a dark room
        # would stay in the dark until they left and came back. The lamp-not-on
        # condition below is what makes this safe after an outage that left the
        # lamp on (Bill 2026-09-22: it stays on).
        from: ["off", "unavailable", "unknown"]
        to: "on"
    condition:
      - condition: state
        entity_id: input_boolean.mmw_office_auto_enable
        state: "on"
      - condition: state
        entity_id: input_boolean.mmw_office_manual_override
        state: "off"
      # ADDED 2026-09-22 — the latch (§4.2) means "THIS automation turned the
      # lamp on". Latching a lamp that was already on - a person lit it, left,
      # and came back after their override had cleared - would let the
      # empty-room automation switch off a lamp a human turned on. The lux
      # test is no guard against that: whether this lamp lifts this node's
      # VEML7700 above lux_on has never been measured.
      - condition: template
        value_template: "{{ not is_state('switch.office_lamp','on') }}"
      # §7: a dead light sensor must not read as "dark". Without this, a failed
      # VEML7700 holds its last value forever and, if that value was low, the
      # lamp comes on in a sunlit room every time someone walks in — and the
      # only symptom is a lamp that is on.
      # CHANGED 2026-09-22: was `condition: state ... state: "off"`, which also
      # refused `unknown` - and `unknown` is what firmware Rev 0.1 reported for
      # a HEALTHY sensor all its life (it published only on a change). Firmware
      # Rev 0.2 publishes on the first tick; this accepts anything except a
      # positive `on`, and the wait below makes sure there IS a reading.
      - condition: template
        value_template: "{{ not is_state('binary_sensor.office_mmwave_lux_stale','on') }}"
      # ADDED 2026-09-22: uncommissioned threshold (0) - see input_number.
      - condition: template
        value_template: "{{ states('input_number.mmw_office_lux_on') | float(0) > 0 }}"
    action:
      # ADDED 2026-09-22 — after a node reboot the radar reports within about a
      # second but the VEML7700 not until its first 10 s read, so the lux test
      # saw `unknown` -> float(999) -> "lit" and refused. Wait for a number.
      - wait_template: "{{ states('sensor.office_mmwave_ambient_light') | is_number }}"
        timeout: "00:00:30"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ not wait.completed }}"
        then:
          - service: logbook.log
            data:
              name: "mmW Office"
              message: "presence, but no lux reading within 30 s - lamp left alone"
          - stop: "no lux reading"
      # §4.2 — LUX IS SAMPLED HERE AND ONLY HERE, at the dark->occupied edge.
      # MOVED 2026-09-22 from `condition:` to after the wait, and presence is
      # re-checked: the room may have emptied during the wait.
      - condition: template
        value_template: >
          {{ is_state('binary_sensor.office_mmwave_presence','on')
             and states('sensor.office_mmwave_ambient_light') | float(999)
                 < states('input_number.mmw_office_lux_on') | float(0) }}
      - service: script.mmw_office_lamp_set
        data:
          lamp_state: "on"
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.mmw_office_latch

  - id: mmw_office_presence_off
    alias: "mmW Office: empty -> lamp off"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.office_mmwave_presence
        # CHANGED 2026-09-22: was `from: "on"`. Bill 2026-09-22: the lamp STAYS
        # ON while the node is offline. Nothing here fires on `unavailable`, and
        # that is the design, not an omission. What `from: "on"` ALSO did was
        # keep a latched lamp on after the node came back to an empty room -
        # 12 of 36 bench returns came back `off` [M] - until someone next walked
        # in and out. (The bench showed the same effect through a different
        # mechanism, a latch held in RAM: 25.9 h of lamp-on after the node was
        # back, over 14.5 days [M].) From `unavailable`/`unknown` the `for:`
        # below still has to elapse, so the release needs the same observed-
        # empty wait as the normal path.
        from: ["on", "unavailable", "unknown"]
        to: "off"
        # TIMEOUT ARITHMETIC. The module already held has_target on for its own
        # `timeout` seconds after the person left, so that time is ALREADY
        # SPENT when this trigger fires. Waiting the full room timeout here on
        # top of it would double-count and A5 would fail with both files
        # looking correct. Subtract, floor at zero.
        for: >
          {# CHANGED 2026-09-22: float(90) -> float(0); the 90 was a second
             copy of the starting value (R10). 0 is refused below. #}
          {% set total = states('input_number.mmw_office_idle_timeout') | float(0) %}
          {% set mod   = states('number.office_mmwave_radar_timeout') | float(30) %}
          {% set w     = [total - mod, 0] | max | int(0) %}
          {{ '%02d:%02d:%02d' % (w // 3600, (w % 3600) // 60, w % 60) }}
    condition:
      - condition: state
        entity_id: input_boolean.mmw_office_auto_enable
        state: "on"
      # ADDED 2026-09-22: an uncommissioned (0) idle timeout means NEVER
      # switch off. The `for:` above computes 0 s from it, which would switch
      # the lamp off the instant the room read empty. Holding the lamp on is
      # the safe failure - the same rule Bill set for a node outage.
      - condition: template
        value_template: "{{ states('input_number.mmw_office_idle_timeout') | float(0) > 0 }}"
    action:
      # Clear the override FIRST: "on room EMPTY for IDLE_TIMEOUT:
      # manual_override = FALSE" (§4.3). The room is now empty by definition.
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.mmw_office_manual_override
      # Only switch off a lamp this automation switched on.
      - condition: state
        entity_id: input_boolean.mmw_office_latch
        state: "on"
      - service: script.mmw_office_lamp_set
        data:
          lamp_state: "off"
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.mmw_office_latch

  # ---- R4a: manual override detection --------------------------------------
  - id: mmw_office_override_detect
    alias: "mmW Office: detect manual intervention"
    mode: single
    trigger:
      - platform: state
        entity_id: switch.office_lamp
        to: ["on", "off"]
    condition:
      # Not our own command. §4.3's 2 s window.
      - condition: template
        value_template: >
          {% set stamp  = states('input_datetime.mmw_office_last_cmd') %}
          {# CHANGED 2026-09-22: float(10) -> float(0), and an uncommissioned
             window flags nothing. Without a window our own command cannot be
             told from a hand at the switch; flagging it would suspend the
             automation on its own first command. Not flagging is benign: the
             latch logic never switches off a lamp it did not light. #}
          {% set window = states('input_number.mmw_office_cmd_window') | float(0) %}
          {% if window <= 0 %}
            false
          {% elif stamp in ['unknown','unavailable',''] %}
            true
          {% else %}
            {{ (as_timestamp(now()) - as_timestamp(stamp)) > window }}
          {% endif %}
      # Ignore restarts and unavailability flapping — only real on/off edges.
      - condition: template
        value_template: >
          {{ trigger.from_state is not none
             and trigger.from_state.state in ['on','off'] }}
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.mmw_office_manual_override
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.mmw_office_latch
      - service: logbook.log
        data:
          name: "mmW Office"
          message: >
            manual intervention detected ({{ trigger.from_state.state }} ->
            {{ trigger.to_state.state }}); automatic control suspended until the
            room is next empty

  # ===========================================================================
  # FAMILY ROOM — presence lighting
  # ===========================================================================
  - id: mmw_family_presence_on
    alias: "mmW Family: presence -> lights on"
    mode: single
    # ADDED 2026-09-22: a second edge during the lux wait below is dropped
    # quietly - it carries no new information, and `single` would log it.
    max_exceeded: silent
    trigger:
      - platform: state
        entity_id: binary_sensor.family_mmwave_presence
        # CHANGED 2026-09-22: was `from: "off"`. On the bench, 24 of 36 returns
        # from `unavailable` came back straight to `on` [M, 2026-09-08..22] -
        # presence already reported when the node or HA reconnected. `from:
        # "off"` fires for none of those, so a person already in a dark room
        # would stay in the dark until they left and came back. The lamp-not-on
        # condition below is what makes this safe after an outage that left the
        # lamp on (Bill 2026-09-22: it stays on).
        from: ["off", "unavailable", "unknown"]
        to: "on"
    condition:
      - condition: state
        entity_id: input_boolean.mmw_family_auto_enable
        state: "on"
      - condition: state
        entity_id: input_boolean.mmw_family_manual_override
        state: "off"
      # ADDED 2026-09-22 — the latch (§4.2) means "THIS automation turned the
      # lamp on". Latching a lamp that was already on - a person lit it, left,
      # and came back after their override had cleared - would let the
      # empty-room automation switch off a lamp a human turned on. The lux
      # test is no guard against that: whether this lamp lifts this node's
      # VEML7700 above lux_on has never been measured.
      # "Not on" rather than "all off": a plug that is unavailable must not
      # stop the other two lighting.
      - condition: template
        value_template: >
          {{ not (is_state('switch.family_room','on')
                  or is_state('switch.family_room_2','on')
                  or is_state('switch.family_room_3','on')) }}
      # §7: a dead light sensor must not read as "dark". Without this, a failed
      # VEML7700 holds its last value forever and, if that value was low, the
      # lamp comes on in a sunlit room every time someone walks in — and the
      # only symptom is a lamp that is on.
      # CHANGED 2026-09-22: was `condition: state ... state: "off"`, which also
      # refused `unknown` - and `unknown` is what firmware Rev 0.1 reported for
      # a HEALTHY sensor all its life (it published only on a change). Firmware
      # Rev 0.2 publishes on the first tick; this accepts anything except a
      # positive `on`, and the wait below makes sure there IS a reading.
      - condition: template
        value_template: "{{ not is_state('binary_sensor.family_mmwave_lux_stale','on') }}"
      # ADDED 2026-09-22: uncommissioned threshold (0) - see input_number.
      - condition: template
        value_template: "{{ states('input_number.mmw_family_lux_on') | float(0) > 0 }}"
      # During armed quiet hours the ALARM owns the lights, not this. Without
      # this condition both automations fire on the same edge and race: one
      # turns the lights on steady while the other is trying to flash them.
      - condition: template
        value_template: >
          {{ not (is_state('binary_sensor.mmw_family_quiet_hours','on')
                  and is_state('input_boolean.mmw_family_alarm_enable','on')
                  and is_state('input_boolean.mmw_family_alarm_disarm_tonight','off')) }}
    action:
      # ADDED 2026-09-22 — after a node reboot the radar reports within about a
      # second but the VEML7700 not until its first 10 s read, so the lux test
      # saw `unknown` -> float(999) -> "lit" and refused. Wait for a number.
      - wait_template: "{{ states('sensor.family_mmwave_ambient_light') | is_number }}"
        timeout: "00:00:30"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ not wait.completed }}"
        then:
          - service: logbook.log
            data:
              name: "mmW Family"
              message: "presence, but no lux reading within 30 s - lamp left alone"
          - stop: "no lux reading"
      # §4.2 — LUX IS SAMPLED HERE AND ONLY HERE, at the dark->occupied edge.
      # MOVED 2026-09-22 from `condition:` to after the wait, and presence is
      # re-checked: the room may have emptied during the wait.
      - condition: template
        value_template: >
          {{ is_state('binary_sensor.family_mmwave_presence','on')
             and states('sensor.family_mmwave_ambient_light') | float(999)
                 < states('input_number.mmw_family_lux_on') | float(0) }}
      - service: script.mmw_family_lamp_set
        data:
          lamp_state: "on"
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.mmw_family_latch

  - id: mmw_family_presence_off
    alias: "mmW Family: empty -> lights off"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.family_mmwave_presence
        # CHANGED 2026-09-22: was `from: "on"`. Bill 2026-09-22: the lamp STAYS
        # ON while the node is offline. Nothing here fires on `unavailable`, and
        # that is the design, not an omission. What `from: "on"` ALSO did was
        # keep a latched lamp on after the node came back to an empty room -
        # 12 of 36 bench returns came back `off` [M] - until someone next walked
        # in and out. (The bench showed the same effect through a different
        # mechanism, a latch held in RAM: 25.9 h of lamp-on after the node was
        # back, over 14.5 days [M].) From `unavailable`/`unknown` the `for:`
        # below still has to elapse, so the release needs the same observed-
        # empty wait as the normal path.
        from: ["on", "unavailable", "unknown"]
        to: "off"
        for: >
          {# CHANGED 2026-09-22: float(300) -> float(0); see the office. #}
          {% set total = states('input_number.mmw_family_idle_timeout') | float(0) %}
          {% set mod   = states('number.family_mmwave_radar_timeout') | float(30) %}
          {% set w     = [total - mod, 0] | max | int(0) %}
          {{ '%02d:%02d:%02d' % (w // 3600, (w % 3600) // 60, w % 60) }}
    condition:
      - condition: state
        entity_id: input_boolean.mmw_family_auto_enable
        state: "on"
      # ADDED 2026-09-22: an uncommissioned (0) idle timeout means NEVER
      # switch off. The `for:` above computes 0 s from it, which would switch
      # the lamp off the instant the room read empty. Holding the lamp on is
      # the safe failure - the same rule Bill set for a node outage.
      - condition: template
        value_template: "{{ states('input_number.mmw_family_idle_timeout') | float(0) > 0 }}"
      - condition: state
        entity_id: input_boolean.mmw_family_alarm_running
        state: "off"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.mmw_family_manual_override
      - condition: state
        entity_id: input_boolean.mmw_family_latch
        state: "on"
      - service: script.mmw_family_lamp_set
        data:
          lamp_state: "off"
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.mmw_family_latch

  - id: mmw_family_override_detect
    alias: "mmW Family: detect manual intervention"
    mode: single
    trigger:
      - platform: state
        entity_id: [switch.family_room, switch.family_room_2, switch.family_room_3]
        to: ["on", "off"]
    condition:
      - condition: state
        entity_id: input_boolean.mmw_family_alarm_running
        state: "off"
      - condition: template
        value_template: >
          {% set stamp  = states('input_datetime.mmw_family_last_cmd') %}
          {# CHANGED 2026-09-22: float(10) -> float(0), and an uncommissioned
             window flags nothing. Without a window our own command cannot be
             told from a hand at the switch; flagging it would suspend the
             automation on its own first command. Not flagging is benign: the
             latch logic never switches off a lamp it did not light. #}
          {% set window = states('input_number.mmw_family_cmd_window') | float(0) %}
          {% if window <= 0 %}
            false
          {% elif stamp in ['unknown','unavailable',''] %}
            true
          {% else %}
            {{ (as_timestamp(now()) - as_timestamp(stamp)) > window }}
          {% endif %}
      - condition: template
        value_template: >
          {{ trigger.from_state is not none
             and trigger.from_state.state in ['on','off'] }}
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.mmw_family_manual_override
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.mmw_family_latch
      - service: logbook.log
        data:
          name: "mmW Family"
          message: >
            manual intervention detected ({{ trigger.from_state.state }} ->
            {{ trigger.to_state.state }}); automatic control suspended until the
            room is next empty

  # ===========================================================================
  # FAMILY ROOM — overnight alarm
  # ===========================================================================
  - id: mmw_family_quiet_alarm
    alias: "mmW Family: quiet-hours alarm"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.family_mmwave_presence
        from: "off"
        to: "on"
    condition:
      - condition: state
        entity_id: input_boolean.mmw_family_alarm_enable
        state: "on"
      - condition: state
        entity_id: input_boolean.mmw_family_alarm_disarm_tonight
        state: "off"
      - condition: state
        entity_id: binary_sensor.mmw_family_quiet_hours
        state: "on"

      # THE ROOM MUST HAVE BEEN GENUINELY EMPTY FIRST.
      # This is the condition that separates an arrival from a dropout. A person
      # asleep on the couch since midnight never produces an off->on edge at
      # all, so they cannot trigger this. But a momentary radar dropout DOES
      # produce one, and without this test the node would strobe the room at
      # someone sleeping in it. Requiring five minutes of continuous empty is
      # what makes the edge mean "someone came in" rather than "the tracker
      # blinked". §5.9.3's L(T) budget is the reason five minutes is safe: any
      # gap approaching it is already a threshold failure and shows up in SPC.
      - condition: template
        value_template: >
          {{ trigger.from_state is not none
             and (as_timestamp(now())
                  - as_timestamp(trigger.from_state.last_changed)) > 300 }}

      # Cooldown, so one restless night is not one flash per re-acquisition.
      - condition: template
        value_template: >
          {% set last = states('input_datetime.mmw_family_alarm_last_fired') %}
          {% if last in ['unknown','unavailable',''] %}
            true
          {% else %}
            {{ (as_timestamp(now()) - as_timestamp(last)) >
               (states('input_number.mmw_family_alarm_cooldown') | int(0) * 60) }}
          {% endif %}
      # ADDED 2026-09-22: no alarm on uncommissioned (0) settings. The cooldown
      # fallback above was `int(15)`, a second copy of the starting value.
      - condition: template
        value_template: >
          {{ states('input_number.mmw_family_alarm_flashes') | int(0) > 0
             and states('input_number.mmw_family_alarm_grace') | int(0) > 0
             and states('input_number.mmw_family_alarm_cooldown') | int(0) > 0 }}
    action:
      - service: script.turn_on
        target:
          entity_id: script.mmw_family_alarm
      # Wait for the sequence to finish, then always clean up. Putting cleanup
      # here rather than at the end of the script means it still runs when the
      # script is stopped early.
      - wait_template: "{{ is_state('script.mmw_family_alarm','off') }}"
        # CHANGED 2026-09-22, was 00:02:00. The longest sequence the helpers
        # allow is 2 blinks (4 s) + 120 s grace + 15 flashes x 3 s (45 s) =
        # 169 s [D] before any relay round trips, so a 2 min wait could stop
        # the alarm mid-sequence. 5 min covers it with room for slow plugs.
        timeout: "00:05:00"
        continue_on_timeout: true
      - service: script.turn_off
        target:
          entity_id: script.mmw_family_alarm
      - service: script.mmw_family_alarm_cleanup

  - id: mmw_family_alarm_rearm
    alias: "mmW Family: re-arm alarm at end of quiet hours"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.mmw_family_quiet_hours
        from: "on"
        to: "off"
    action:
      # "Disarm tonight" means tonight. Clearing it at the END of quiet hours
      # rather than at a fixed clock time means it cannot be cleared while the
      # window is still open, which is what would make it useless.
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.mmw_family_alarm_disarm_tonight
      - service: persistent_notification.dismiss
        data:
          notification_id: mmw_family_alarm

  # ===========================================================================
  # CALIBRATION SUPPORT
  # ===========================================================================
  # Selecting any label except "unlabelled" starts a labelled run: engineering
  # mode on (the gate energies do not exist otherwise, §6.1) and the hold set so
  # the nightly SPC window cannot close it underneath the collection.
  - id: mmw_office_cal_label_changed
    alias: "mmW Office: label change starts a labelled run"
    mode: single
    trigger:
      - platform: state
        entity_id: input_select.mmw_office_label
    condition:
      - condition: template
        value_template: "{{ trigger.to_state.state != 'unlabelled' }}"
    action:
      - service: switch.turn_on
        target:
          entity_id: switch.office_mmwave_calibration_hold
      - service: logbook.log
        data:
          name: "mmW Office calibration"
          message: >
            label -> {{ trigger.to_state.state }}
            (class {{ states('sensor.mmw_office_cal_class') }})

  - id: mmw_family_cal_label_changed
    alias: "mmW Family: label change starts a labelled run"
    mode: single
    trigger:
      - platform: state
        entity_id: input_select.mmw_family_label
    condition:
      - condition: template
        value_template: "{{ trigger.to_state.state != 'unlabelled' }}"
    action:
      - service: switch.turn_on
        target:
          entity_id: switch.family_mmwave_calibration_hold
      - service: logbook.log
        data:
          name: "mmW Family calibration"
          message: >
            label -> {{ trigger.to_state.state }}
            (class {{ states('sensor.mmw_family_cal_class') }})

  # ---- the label he will forget to change ----------------------------------
  # A seat label left set after he gets up does not just lose data, it puts an
  # empty room into the OCCUPIED class, which lowers E_signal's P5 and drags
  # every still threshold down with it. Ten minutes of confirmed absence
  # downgrades the label to "no one present" — a downgrade only, never an
  # upgrade, because the machine can tell that nobody is there and cannot tell
  # which chair somebody is in.
  - id: mmw_office_cal_label_autoclear
    alias: "mmW Office: downgrade stale seat label"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.office_mmwave_presence
        to: "off"
        for: "00:10:00"
    condition:
      - condition: not
        conditions:
          - condition: state
            entity_id: input_select.mmw_office_label
            state: ["unlabelled", "no one present"]
    action:
      - service: input_select.select_option
        target:
          entity_id: input_select.mmw_office_label
        data:
          option: "no one present"
      - service: logbook.log
        data:
          name: "mmW Office calibration"
          message: "seat label stale for 10 min of confirmed absence — downgraded to 'no one present'"

  - id: mmw_family_cal_label_autoclear
    alias: "mmW Family: downgrade stale seat label"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.family_mmwave_presence
        to: "off"
        for: "00:10:00"
    condition:
      - condition: not
        conditions:
          - condition: state
            entity_id: input_select.mmw_family_label
            state: ["unlabelled", "no one present"]
    action:
      - service: input_select.select_option
        target:
          entity_id: input_select.mmw_family_label
        data:
          option: "no one present"
      - service: logbook.log
        data:
          name: "mmW Family calibration"
          message: "seat label stale for 10 min of confirmed absence — downgraded to 'no one present'"

  # ---- data-quality alert --------------------------------------------------
  - id: mmw_label_contradicted_alert
    alias: "mmW: label contradicted by presence"
    mode: single
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.mmw_office_label_contradicted
          - binary_sensor.mmw_family_label_contradicted
        to: "on"
    action:
      - service: persistent_notification.create
        data:
          title: "mmWave calibration: contradicted label"
          notification_id: "mmw_label_contradicted_{{ trigger.entity_id }}"
          message: >
            {{ trigger.entity_id }} — the label says nobody is present but the
            radar has held presence for over a minute. Data collected in this
            state contaminates the EMPTY class, which sets E_clutter and every
            move threshold with it (§5.3, §5.9). Fix the label or leave the
            room; then discard this interval in the analysis.

  # ===========================================================================
  # HEALTH — §6.2 / §6.3
  # ===========================================================================
  - id: mmw_dropout_candidate_alert
    alias: "mmW: radar says empty, thermostat says occupied"
    mode: single
    trigger:
      - platform: state
        entity_id:
          # Family room only. The office has no independent witness — the
          # upstairs thermostat is too far away to see it.
          - binary_sensor.mmw_family_dropout_candidate
        to: "on"
    action:
      - service: persistent_notification.create
        data:
          title: "mmWave: possible presence dropout"
          notification_id: "mmw_dropout_{{ trigger.entity_id }}"
          message: >
            {{ trigger.entity_id }} — the radar has reported the room empty for
            ten minutes while the thermostat on that floor still reports
            occupancy.

            This is a CANDIDATE, not a fault. The thermostat is elsewhere on the
            floor and its occupancy holds long after somebody leaves, so the
            innocent explanation is usually the right one. What makes it worth a
            notification is that it is the only dropout evidence available from a
            sensor that is not the radar itself — §5.9.3's L(T) is computed on
            the radar's own energies and inherits any fault in them.

            If these cluster at one time of day or one seat, that is the R1
            failure the still thresholds exist to prevent: re-run §5.9 for that
            seat and check L(T) against the idle-timeout budget.

  - id: mmw_path_disagreement_alert
    alias: "mmW: presence paths disagree"
    mode: single
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.office_mmwave_presence_path_disagreement
          - binary_sensor.family_mmwave_presence_path_disagreement
        to: "on"
        for: "00:05:00"
    action:
      - service: persistent_notification.create
        data:
          title: "mmWave: UART and hardware presence disagree"
          notification_id: "mmw_path_disagree_{{ trigger.entity_id }}"
          message: >
            {{ trigger.entity_id }} has held disagreement for 5 minutes. Both
            paths come off the same radar, so this is a UART desync or a stalled
            component, not a sensing failure (§6.2). The hardware OUT path is
            still valid — the node is degraded, not blind (§7). Check the radar
            firmware text sensor and the node log before power-cycling anything.

  - id: mmw_lux_stale_alert
    alias: "mmW: light sensor stale"
    mode: single
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.office_mmwave_lux_stale
          - binary_sensor.family_mmwave_lux_stale
        to: "on"
    action:
      - service: persistent_notification.create
        data:
          title: "mmWave: VEML7700 not reporting"
          notification_id: "mmw_lux_stale_{{ trigger.entity_id }}"
          message: >
            {{ trigger.entity_id }} — no lux reading for over an hour. The
            lighting automation for that room is now inhibited by design (§7):
            it will not act on a stale reading, so the wall switch is
            authoritative until this clears. First suspect is the STEMMA QT
            cable — four independent crimped sockets on a 150 mm flying lead.

  # ===========================================================================
  # COMMISSIONING DEFAULTS — the ONE place the starting values live (R10)
  # ===========================================================================
  # ADDED 2026-09-22. See CORRECTED at input_number: with no `initial:` and
  # nothing to restore, HA starts an input_number at its minimum. So every
  # commissioned helper has `min: 0`, 0 means "uncommissioned", and this
  # writes the starting value into any helper that reads 0. It never touches
  # a helper that holds anything else, so a value set on the dashboard - or
  # derived in §5.9 - survives restarts untouched.
  #
  # WHERE THE NUMBERS COME FROM:
  #   lux_on 18 lx       §5.6; the basement node reads 23-25 lx lit-but-dim.
  #                      Provisional until §5.0 step 0.6 measures the lid.
  #   office idle 120 s  §5.5 gives 60-120 s. Bench replay over 14.5 days,
  #                      office presence at the BENCH position [D]:
  #                        total  lamp-offs  re-lit within 60 s
  #                          90      116          12
  #                         120      106           4
  #                         150      104           5
  #                         180      102           4
  #                      120 s is where the re-lights stop falling. Re-check
  #                      after §5.2 - the mount sees a different room.
  #   family idle 300 s  §5.5: 300 s+. Not measured - no family node yet.
  #   cmd window 10 s    R4a, see the note at input_number. Bench decision->
  #                      lamp P95 1.498 s, n=61 [M, HA timestamps - the same
  #                      clock R4a's window is judged on]; 10 s leaves 8.5 s
  #                      above it [D].
  #   alarm 6 / 20 s / 15 min   flashes / grace / cooldown, see the alarm
  #                      notes. Chosen, not measured.
  - id: mmw_seed_uncommissioned_helpers
    alias: "mmW: seed uncommissioned helpers"
    mode: queued
    max_exceeded: silent
    # trigger_variables, not variables: the template trigger needs the map,
    # and HA 2026.9.3 folds trigger_variables into the run variables too
    # (automation/__init__.py, CONF_TRIGGER_VARIABLES merge) - one copy serves
    # both.
    trigger_variables:
      defaults:
        input_number.mmw_office_lux_on: 18
        input_number.mmw_family_lux_on: 18
        input_number.mmw_office_idle_timeout: 120
        input_number.mmw_family_idle_timeout: 300
        input_number.mmw_office_cmd_window: 10
        input_number.mmw_family_cmd_window: 10
        input_number.mmw_family_alarm_flashes: 6
        input_number.mmw_family_alarm_grace: 20
        input_number.mmw_family_alarm_cooldown: 15
    trigger:
      - platform: homeassistant
        event: start
      # A helper that DROPS to 0 while HA runs is re-seeded at once, not at
      # the next restart. A template trigger does not fire if it is already
      # true when attached - which is why the start trigger is also needed.
      - platform: template
        value_template: >
          {{ defaults.keys() | map('states') | map('float', -1)
             | select('eq', 0) | list | count > 0 }}
    action:
      - repeat:
          for_each: "{{ defaults.keys() | list }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ states(repeat.item) | float(-1) == 0 }}"
              then:
                - service: input_number.set_value
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    value: "{{ defaults[repeat.item] }}"
                - service: logbook.log
                  data:
                    name: "mmW commissioning"
                    entity_id: "{{ repeat.item }}"
                    message: "read 0 (uncommissioned); seeded to {{ defaults[repeat.item] }}"


# -----------------------------------------------------------------------------
# RECORDER
# -----------------------------------------------------------------------------
# ADDED 2026-09-22. The bench node wrote 361,794 recorder rows in 24 h [M,
# 2026-09-21/22], and 114,740 of them were the five radar summary series
# below - every frame's distance and energy. Nothing reads their history: no
# card charts them, no automation reads them, and the calibration works from
# the per-gate energies, not these. Live state is unaffected (the alarm
# message still reads the moving distance).
#
# NOT excluded, deliberately:
#   * the 18 gate series - they ARE the calibration and SPC data (§5.9,
#     §6.1). The bench's 156,597 rows/day were engineering mode held on
#     around the clock; in production it is on for the 10-minute SPC window
#     and labelled runs only.
#   * moving_target - the family dashboard charts it.
# Explicit ids, not a glob: `sensor.*_mmwave_*` would also catch the bench
# node's sensor.bench_mmwave_* series. HA merges a package's
# recorder.exclude lists into the main recorder config (config.py
# merge_packages_config, 2026.9.3).
recorder:
  exclude:
    entities:
      - sensor.office_mmwave_moving_distance
      - sensor.office_mmwave_still_distance
      - sensor.office_mmwave_detection_distance
      - sensor.office_mmwave_moving_energy
      - sensor.office_mmwave_still_energy
      - sensor.family_mmwave_moving_distance
      - sensor.family_mmwave_still_distance
      - sensor.family_mmwave_detection_distance
      - sensor.family_mmwave_moving_energy
      - sensor.family_mmwave_still_energy

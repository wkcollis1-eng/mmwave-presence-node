# =============================================================================
# DASHBOARD VIEW — Hallway mmWave node (node 3, top of the stairs)
# ADDED 2026-10-29. Same `type: sections` layout as view-mmwave-office.yaml,
# cut to what this node does: presence lighting only. No label buttons (no
# collection is planned), no occupied filter, no alarm.
# -----------------------------------------------------------------------------
# Bill: "turn lamp on for 10 minutes (user setable on the dash board)" and the
# threshold "user settab;e on the dashboard". Those two rows are the first
# controls in the Light section.
#
# The darkness test reads "Darkest, last 5 min", NOT "Lux now": the stair
# light is already on when the radar first sees anyone (Bill), so the reading
# at the presence edge is the stair light. Both rows are shown so the
# difference can be seen.
# =============================================================================
type: sections
max_columns: 3
icon: mdi:radar
path: mmwave-hallway
title: Hallway mmWave
header:
  card:
    type: markdown
    text_only: true
    content: |
      # Hallway presence node
      Top of the stairs. The lamp decides on the light **before** anyone arrived.

badges:
  - type: entity
    entity: sensor.hallway_mmwave_ambient_light
    name: Lux now
  - type: entity
    entity: sensor.mmw_hallway_lux_before_presence
    name: Darkest 5 min
  - type: entity
    entity: binary_sensor.hallway_mmwave_presence
    name: Presence
  - type: entity
    entity: switch.hallway_lamp
    name: Lamp
  - type: entity
    entity: sensor.hallway_mmwave_node_rssi
    name: RSSI

sections:
  # ---------------------------------------------------------------------------
  - type: grid
    cards:
      - type: markdown
        text_only: true
        content: >
          ### Light


          When the radar first sees someone, the lamp comes on if **Darkest,
          last 5 min** is below **Turn on below**. It goes off when the radar
          has seen no one for **Lamp on for** minutes. Every decision is in the
          Logbook under "mmW Hallway", with both readings - use those lines to
          set the threshold. The 18 lx it starts at is the office's, not
          measured here.

      - type: entities
        title: The controlled load
        entities:
          - entity: switch.hallway_lamp
            name: Hallway lamp (Kasa HS103)

      - type: entities
        entities:
          - entity: input_number.mmw_hallway_lux_on
            name: Turn on below
          - entity: input_number.mmw_hallway_on_minutes
            name: Lamp on for (after last presence)
          - type: divider
          - entity: sensor.mmw_hallway_lux_before_presence
            name: Darkest, last 5 min (the test)
          - entity: sensor.hallway_mmwave_ambient_light
            name: Lux now (includes the stair light)
          - type: divider
          # The radar's own hold, read-only for the office's reason: the
          # firmware pushes radar_timeout_s at every boot, so a live change is
          # undone at the next one - change it in esphome/mmwave-hallway-node.yaml.
          # The lamp's hold is the larger of the two.
          - type: simple-entity
            entity: number.hallway_mmwave_radar_timeout
            name: Radar hold (minimum on-time, s)
          - entity: input_number.mmw_hallway_cmd_window
            name: R4a command window
          - type: divider
          - entity: input_boolean.mmw_hallway_auto_enable
            name: Automatic lighting
          - entity: input_boolean.mmw_hallway_latch
            name: Lamp latched by presence
          - entity: input_boolean.mmw_hallway_manual_override
            name: Manual override active

  # ---------------------------------------------------------------------------
  - type: grid
    column_span: 2
    cards:
      - type: markdown
        text_only: true
        content: >
          ### Live radar


          Max move and still gate are 3 (to 3.00 m; Bill asked for 8 ft, 2.44 m).
          Gate 4 is drawn too: if someone coming up the stairs shows on gate 4
          before gate 3, the slant range is longer than 8 ft and gate 4 is
          needed. Gate energies only exist while engineering mode is on.

      - type: history-graph
        hours_to_show: 6
        title: Presence and light
        entities:
          - entity: binary_sensor.hallway_mmwave_presence
            name: Presence (UART)
          - entity: binary_sensor.hallway_mmwave_presence_hardware_out
            name: Presence (OUT wire)
          - entity: switch.hallway_lamp
            name: Lamp
          - entity: sensor.hallway_mmwave_ambient_light
            name: Lux now
          - entity: sensor.mmw_hallway_lux_before_presence
            name: Darkest, last 5 min

      - type: history-graph
        hours_to_show: 2
        title: Move energy by gate
        entities:
          - sensor.hallway_mmwave_g0_move
          - sensor.hallway_mmwave_g1_move
          - sensor.hallway_mmwave_g2_move
          - sensor.hallway_mmwave_g3_move
          - sensor.hallway_mmwave_g4_move

      - type: history-graph
        hours_to_show: 2
        title: Still energy by gate
        entities:
          - sensor.hallway_mmwave_g0_still
          - sensor.hallway_mmwave_g1_still
          - sensor.hallway_mmwave_g2_still
          - sensor.hallway_mmwave_g3_still
          - sensor.hallway_mmwave_g4_still

  # ---------------------------------------------------------------------------
  - type: grid
    cards:
      - type: entities
        title: Node health (§6.2, §6.3)
        entities:
          - entity: switch.hallway_mmwave_radar_engineering_mode
            name: Engineering mode
          - entity: binary_sensor.hallway_mmwave_presence_path_disagreement
            name: UART vs OUT disagreement
          - entity: sensor.hallway_mmwave_presence_path_skew
            name: Path skew
          - entity: binary_sensor.hallway_mmwave_lux_stale
            name: Lux stale
          - entity: sensor.hallway_mmwave_lux_age
            name: Lux age
          - entity: sensor.hallway_mmwave_node_rssi
            name: RSSI
          - entity: sensor.hallway_mmwave_node_temperature
            name: Node temperature
          - entity: sensor.hallway_mmwave_node_uptime
            name: Uptime
          - entity: sensor.hallway_mmwave_node_reset_reason
            name: Last reset reason
          - entity: sensor.hallway_mmwave_radar_firmware
            name: Radar firmware
          # Read-only for the office's reason: pushed at every boot.
          - type: simple-entity
            entity: number.hallway_mmwave_max_move_gate
            name: Max move gate
          - type: simple-entity
            entity: number.hallway_mmwave_max_still_gate
            name: Max still gate

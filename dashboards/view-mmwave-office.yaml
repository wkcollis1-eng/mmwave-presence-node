# =============================================================================
# DASHBOARD VIEW — Office mmWave node
# Rev 0.1 DRAFT (2026-09-05). Matches the `type: sections` convention used by
# dashboards/views/dehumidifier.yaml.
# -----------------------------------------------------------------------------
# This is the panel that sits on the desk during the collection. It has exactly
# one job during those 48-72 hours: make labelling a single tap, so it actually
# gets done. Everything else on the view is there to tell you whether the data
# being collected is any good.
#
# THE LABEL BUTTONS ARE FIRST AND LARGEST ON PURPOSE. A label that takes three
# taps through a dropdown gets skipped, and a skipped label is worse than no
# label: the interval still gets recorded, just into the wrong class.
# =============================================================================
type: sections
max_columns: 3
icon: mdi:radar
path: mmwave-office
title: Office mmWave
header:
  card:
    type: markdown
    text_only: true
    content: |
      # Office presence node
      Tap what you are doing. Tap **No one present** when you leave.

badges:
  - type: entity
    entity: sensor.mmw_office_state
    name: State
  - type: entity
    entity: sensor.office_mmwave_ambient_light
    name: Lux
  - type: entity
    entity: binary_sensor.office_mmwave_presence
    name: Presence
  - type: entity
    entity: switch.office_mmwave_radar_engineering_mode
    name: Eng mode
  - type: entity
    entity: binary_sensor.mmw_office_label_contradicted
    name: Label check
  - type: entity
    entity: sensor.office_mmwave_node_rssi
    name: RSSI

sections:
  # ---------------------------------------------------------------------------
  - type: grid
    column_span: 2
    cards:
      - type: markdown
        text_only: true
        content: "### What is happening now"

      - type: horizontal-stack
        cards:
          - type: button
            name: Sitting at desk
            icon: mdi:desk
            icon_height: 56px
            show_state: false
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.mmw_office_label
              data:
                option: sitting at desk
          - type: button
            name: Moving in office
            icon: mdi:walk
            icon_height: 56px
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.mmw_office_label
              data:
                option: moving in office

      - type: horizontal-stack
        cards:
          - type: button
            name: Entering office
            icon: mdi:door-open
            icon_height: 56px
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.mmw_office_label
              data:
                option: entering office
          - type: button
            name: No one present
            icon: mdi:account-off
            icon_height: 56px
            tap_action:
              action: perform-action
              perform_action: input_select.select_option
              target:
                entity_id: input_select.mmw_office_label
              data:
                option: no one present

      - type: entities
        title: Current label
        entities:
          - entity: input_select.mmw_office_label
            name: Label (dropdown fallback)
          - entity: sensor.mmw_office_cal_class
            name: Recorded class
          - entity: switch.office_mmwave_calibration_hold
            name: Calibration hold (keeps eng mode on)

  # ---------------------------------------------------------------------------
  - type: grid
    cards:
      - type: markdown
        text_only: true
        content: >
          ### Light


          `Turn on below` is the only number that decides whether the lamp comes
          on. It is sampled once, at the moment presence starts, and then not
          looked at again until the room empties — that latch is what stops the
          lamp switching itself off by lighting the room (§4.2).

      - type: gauge
        entity: sensor.office_mmwave_ambient_light
        name: Ambient light
        unit: lx
        min: 0
        max: 60
        needle: true
        severity:
          green: 0
          yellow: 18
          red: 30

      - type: entities
        title: The controlled load
        entities:
          - entity: switch.office_lamp
            name: Office lamp (Kasa HS103)
        # NOT switch.office_lamp_led — that is the plug's own status indicator,
        # and one of those on a lighting view is how somebody eventually toggles
        # it and reports the lamp as broken.

      - type: entities
        entities:
          - entity: input_number.mmw_office_lux_on
            name: Turn on below
          - entity: input_number.mmw_office_lux_off
            name: Consider room lit above
          - entity: input_number.mmw_office_idle_timeout
            name: Idle timeout (total)
          - entity: input_number.mmw_office_cmd_window
            name: R4a command window
          - type: divider
          - entity: input_boolean.mmw_office_auto_enable
            name: Automatic lighting
          - entity: input_boolean.mmw_office_latch
            name: Lamp latched by presence
          - entity: input_boolean.mmw_office_manual_override
            name: Manual override active

  # ---------------------------------------------------------------------------
  - type: grid
    cards:
      - type: markdown
        text_only: true
        content: >
          ### Collection coverage


          Targets: **6 h** empty (spanning at least one heating or cooling
          cycle), **1 h** at the desk including one unbroken 10-minute run.
          Hours below those and the thresholds derived from this data are not
          supported by it.

      - type: entities
        entities:
          - entity: sensor.mmw_office_hours_empty
            name: Empty
          - entity: sensor.mmw_office_hours_at_desk
            name: Sitting at desk
          - entity: sensor.mmw_office_hours_moving
            name: Moving in office
          - entity: sensor.mmw_office_hours_entering
            name: Entering office

  # ---------------------------------------------------------------------------
  - type: grid
    column_span: 3
    cards:
      - type: markdown
        text_only: true
        content: >
          ### Live radar


          Gate energies only exist while engineering mode is on (§6.1). If these
          are flat, check the Eng mode badge before suspecting the radar.

      - type: history-graph
        hours_to_show: 6
        title: Presence and light
        entities:
          - entity: binary_sensor.office_mmwave_presence
            name: Presence (UART)
          - entity: binary_sensor.office_mmwave_presence_hardware_out
            name: Presence (OUT wire)
          - entity: input_select.mmw_office_label
            name: Label
          - entity: sensor.office_mmwave_ambient_light
            name: Lux

      - type: history-graph
        hours_to_show: 2
        title: Move energy by gate
        entities:
          - sensor.office_mmwave_g0_move
          - sensor.office_mmwave_g1_move
          - sensor.office_mmwave_g2_move
          - sensor.office_mmwave_g3_move
          - sensor.office_mmwave_g4_move

      - type: history-graph
        hours_to_show: 2
        title: Still energy by gate
        entities:
          - sensor.office_mmwave_g0_still
          - sensor.office_mmwave_g1_still
          - sensor.office_mmwave_g2_still
          - sensor.office_mmwave_g3_still
          - sensor.office_mmwave_g4_still

  # ---------------------------------------------------------------------------
  - type: grid
    column_span: 3
    cards:
      - type: markdown
        text_only: true
        content: >
          ### No independent witness in this room


          The family room view has a thermostat cross-check on its empty class.
          **The office does not** — the upstairs Ecobee is too far away to see
          this room, so its motion and occupancy sensors are not evidence about
          it and are deliberately absent here.


          What that costs: `E_clutter` for this node rests entirely on the
          labelling being right. On synthetic data, ten minutes of mislabelled
          occupancy inside a ninety-minute empty run was enough to condemn a
          good gate. In the family room `--corroborate` catches that. **Here,
          discipline is the only control** — tap *No one present* when you get
          up, and treat the label-contradiction badge as the last line rather
          than a backstop.


          The zone below is still correct and still useful: the office IS on the
          upstairs zone, so `hvac_action` is the right blower covariate for
          collection B. Blower state is a property of the zone, not of how far
          away the thermostat sits.

      - type: entities
        entities:
          - entity: climate.upstairs
            name: Zone (blower covariate — still valid)

      - type: entities
        title: Node health (§6.2, §6.3)
        entities:
          - entity: binary_sensor.office_mmwave_presence_path_disagreement
            name: UART vs OUT disagreement
          - entity: sensor.office_mmwave_presence_path_skew
            name: Path skew
          - entity: binary_sensor.office_mmwave_lux_stale
            name: Lux stale
          - entity: sensor.office_mmwave_lux_age
            name: Lux age
          - entity: sensor.office_mmwave_node_rssi
            name: RSSI
          - entity: sensor.office_mmwave_node_temperature
            name: Node temperature
          - entity: sensor.office_mmwave_node_uptime
            name: Uptime
          - entity: sensor.office_mmwave_node_reset_reason
            name: Last reset reason
          - entity: sensor.office_mmwave_radar_firmware
            name: Radar firmware

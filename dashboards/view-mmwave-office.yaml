# =============================================================================
# DASHBOARD VIEW — Office mmWave node
# Rev 0.1 DRAFT (2026-09-05). Matches the `type: sections` convention used by
# dashboards/views/dehumidifier.yaml.
# -----------------------------------------------------------------------------
# This is the panel that sits on the desk during the collection. It has exactly
# one job during those 48-72 hours: make labelling a single tap, so it actually
# gets done. Everything else on the view is there to tell you whether the data
# being collected is any good.
#
# THE LABEL BUTTONS ARE FIRST AND LARGEST ON PURPOSE. A label that takes three
# taps through a dropdown gets skipped, and a skipped label is worse than no
# label: the interval still gets recorded, just into the wrong class.
#
# CHANGED 2026-09-28: the node went live (P24, GO-LIVE DECISIONS). The label
# buttons stay first because the labels still score the P24 tuning. The
# collection-phase cards below are updated, each with its own dated note.
# =============================================================================
type: sections
max_columns: 3
icon: mdi:radar
path: mmwave-office
title: Office mmWave
header:
  card:
    type: markdown
    text_only: true
    content: |
      # Office presence node
      Tap what you are doing. Tap **No one present** when you leave.

badges:
  - type: entity
    entity: sensor.mmw_office_state
    name: State
  - type: entity
    entity: sensor.office_mmwave_ambient_light
    name: Lux
  - type: entity
    entity: binary_sensor.office_mmwave_presence
    name: Presence
  - type: entity
    entity: switch.office_mmwave_radar_engineering_mode
    name: Eng mode
  - type: entity
    entity: binary_sensor.mmw_office_label_contradicted
    name: Label check
  - type: entity
    entity: sensor.office_mmwave_node_rssi
    name: RSSI

sections:
  # ---------------------------------------------------------------------------
  # The label buttons live in grid-mmwave-office-label.yaml, shared with the
  # buttons-only Label tab (view-mmwave-office-label.yaml). Edit them there.
  - !include grid-mmwave-office-label.yaml

  # ---------------------------------------------------------------------------
  - type: grid
    cards:
      - type: markdown
        text_only: true
        content: >
          ### Light


          `Turn on below` is the only number that decides whether the lamp comes
          on. It is sampled once, at the moment presence starts, and then not
          looked at again until the room empties — that latch is what stops the
          lamp switching itself off by lighting the room (§4.2).

      - type: gauge
        entity: sensor.office_mmwave_ambient_light
        name: Ambient light
        unit: lx
        min: 0
        max: 60
        # CHANGED 2026-09-28: needle and severity bands (green 0 / yellow 18 /
        # red 30) removed. The bands were a second copy of lux_on - 18 was the
        # provisional seed - and a gauge cannot read a helper, so any number
        # here goes stale the next time "Turn on below" is changed (R10). That
        # row, beside this card, is the one copy. The needle only pointed into
        # the bands.

      - type: entities
        title: The controlled load
        entities:
          - entity: switch.office_lamp
            name: Office lamp (Kasa HS103)
        # NOT switch.office_lamp_led — that is the plug's own status indicator,
        # and one of those on a lighting view is how somebody eventually toggles
        # it and reports the lamp as broken.

      - type: entities
        entities:
          - entity: input_number.mmw_office_lux_on
            name: Turn on below
          # CHANGED 2026-09-22: lux_off row removed with the helper - it
          # controlled nothing (see the package). Replaced by the measured
          # presence->lamp latency as HA sees it (not R2 itself; see package).
          - entity: sensor.mmw_office_presence_to_lamp_latency
            name: Presence to lamp (last, s)
          - entity: input_number.mmw_office_idle_timeout
            name: Idle timeout (total)
          # ADDED 2026-09-28: the radar's own hold. The lamp's hold is the
          # larger of the two, because the off automation waits
          # max(idle - radar, 0) past presence-off. Read-only on purpose: the
          # firmware pushes radar_timeout_s at every boot, so a live change
          # here is undone at the next one - change it in
          # esphome/mmwave-office-node.yaml.
          - type: simple-entity
            entity: number.office_mmwave_radar_timeout
            name: Radar hold (minimum total)
          - entity: input_number.mmw_office_cmd_window
            name: R4a command window
          - type: divider
          - entity: input_boolean.mmw_office_auto_enable
            name: Automatic lighting
          - entity: input_boolean.mmw_office_latch
            name: Lamp latched by presence
          - entity: input_boolean.mmw_office_manual_override
            name: Manual override active

  # ---------------------------------------------------------------------------
  - type: grid
    cards:
      - type: markdown
        text_only: true
        # CHANGED 2026-09-28: was "Collection coverage", with the 6 h empty /
        # 1 h at-desk collection targets. Retired at go-live.
        content: >
          ### Labelled hours


          Hours recorded under each label. The collection targets are retired:
          the node went live on 2026-09-28 and the heat-on collection (B) was
          waived. The labels still score the P24 tuning.

      - type: entities
        entities:
          - entity: sensor.mmw_office_hours_empty
            name: Empty
          - entity: sensor.mmw_office_hours_at_desk
            name: Sitting at desk
          - entity: sensor.mmw_office_hours_moving
            name: Moving in office
          - entity: sensor.mmw_office_hours_entering
            name: Entering office

  # ---------------------------------------------------------------------------
  - type: grid
    column_span: 3
    cards:
      - type: markdown
        text_only: true
        content: >
          ### Live radar


          Gate energies only exist while engineering mode is on (§6.1). If these
          are flat, check the Eng mode badge before suspecting the radar. The
          target distances do not need it.

      - type: history-graph
        hours_to_show: 6
        title: Presence and light
        entities:
          - entity: binary_sensor.office_mmwave_presence
            name: Presence (UART)
          - entity: binary_sensor.office_mmwave_presence_hardware_out
            name: Presence (OUT wire)
          # ADDED 2026-09-28: what the lamp follows (the P24 approach filter)
          # and the lamp itself, so a lamp-off reads here end to end.
          - entity: binary_sensor.mmw_office_occupied
            name: Occupied (the lamp follows this)
          - entity: switch.office_lamp
            name: Lamp
          - entity: input_select.mmw_office_label
            name: Label
          - entity: sensor.office_mmwave_ambient_light
            name: Lux

      # ADDED 2026-09-28 for the P24 tuning (Bill: "we need the 2 distance
      # readings for tuning"). Both update with engineering mode off. 2 h,
      # like the gate graphs, because both series are dense. REMOVE THIS CARD
      # when the tuning closes and the two series are excluded from the
      # recorder again - after that it draws nothing.
      - type: history-graph
        hours_to_show: 2
        title: Target distance (P24 tuning)
        entities:
          - entity: sensor.office_mmwave_moving_distance
            name: Moving
          - entity: sensor.office_mmwave_still_distance
            name: Still

      - type: history-graph
        hours_to_show: 2
        title: Move energy by gate
        entities:
          - sensor.office_mmwave_g0_move
          - sensor.office_mmwave_g1_move
          - sensor.office_mmwave_g2_move
          - sensor.office_mmwave_g3_move
          - sensor.office_mmwave_g4_move

      - type: history-graph
        hours_to_show: 2
        title: Still energy by gate
        entities:
          - sensor.office_mmwave_g0_still
          - sensor.office_mmwave_g1_still
          - sensor.office_mmwave_g2_still
          - sensor.office_mmwave_g3_still
          - sensor.office_mmwave_g4_still

  # ---------------------------------------------------------------------------
  # CHANGED 2026-09-28: the "No independent witness in this room" note and
  # the climate.upstairs blower-covariate card are removed, and with them
  # this section's full width. Both served collection B, which Bill waived
  # at go-live (the heat-on test, A6). The text is in git history (4c97a32).
  - type: grid
    cards:
      - type: entities
        title: Node health (§6.2, §6.3)
        entities:
          - entity: binary_sensor.office_mmwave_presence_path_disagreement
            name: UART vs OUT disagreement
          - entity: sensor.office_mmwave_presence_path_skew
            name: Path skew
          - entity: binary_sensor.office_mmwave_lux_stale
            name: Lux stale
          - entity: sensor.office_mmwave_lux_age
            name: Lux age
          - entity: sensor.office_mmwave_node_rssi
            name: RSSI
          - entity: sensor.office_mmwave_node_temperature
            name: Node temperature
          - entity: sensor.office_mmwave_node_uptime
            name: Uptime
          - entity: sensor.office_mmwave_node_reset_reason
            name: Last reset reason
          - entity: sensor.office_mmwave_radar_firmware
            name: Radar firmware
          # ADDED 2026-09-28 (P25): firmware 0.4 pushes this at every boot.
          # Read-only on purpose: a live change is undone at the next boot -
          # change g0_move in esphome/mmwave-office-node.yaml.
          - type: simple-entity
            entity: number.office_mmwave_g0_move_threshold
            name: G0 move threshold
